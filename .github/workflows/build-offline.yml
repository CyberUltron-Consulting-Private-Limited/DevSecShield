name: Build Offline Installer Packages

on:
  workflow_dispatch:
    inputs:
      pbs_tag:
        description: "python-build-standalone release tag"
        required: false
        default: "20260303"
      python_version:
        description: "Python version to bundle"
        required: false
        default: "3.12.13"

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build offline bundles (per platform)
  # ---------------------------------------------------------------------------
  build-offline:
    strategy:
      matrix:
        include:
          - os: macos-14          # ARM64 runner
            platform: macos-arm64
            archive_ext: tar.gz
          - os: windows-latest
            platform: windows-amd64
            archive_ext: zip
          - os: ubuntu-latest
            platform: linux-x86_64
            archive_ext: tar.gz

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install pyinstaller psutil cryptography certifi

      # Step 1: Prepare the offline bundle (download Python + wheels)
      - name: Prepare offline bundle
        run: |
          python scripts/build_offline_package.py \
            --platform ${{ matrix.platform }} \
            --out-dir dist/offline \
            --no-archive \
            --pbs-tag ${{ github.event.inputs.pbs_tag || '20260303' }}

      # Step 2: Build the agent binary + assemble the offline package
      - name: Build agent binary with offline package
        run: |
          python scripts/build_agent.py \
            --out-dir dist/offline \
            --offline \
            --offline-dir dist/offline/_offline

      # Step 3: Upload the offline archive
      - name: Upload offline package
        uses: actions/upload-artifact@v4
        with:
          name: aiguardx-offline-${{ matrix.platform }}
          path: dist/offline/aiguardx-offline-${{ matrix.platform }}.${{ matrix.archive_ext }}
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 2: Verify offline install (smoke test)
  # ---------------------------------------------------------------------------
  verify-offline:
    needs: build-offline
    strategy:
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
            archive_ext: tar.gz
          - os: ubuntu-latest
            platform: linux-x86_64
            archive_ext: tar.gz
          # Windows verification would need special handling for tar.gz/zip

    runs-on: ${{ matrix.os }}
    name: Verify ${{ matrix.platform }}

    steps:
      - name: Download offline package
        uses: actions/download-artifact@v4
        with:
          name: aiguardx-offline-${{ matrix.platform }}
          path: .

      - name: Extract archive
        run: tar xzf aiguardx-offline-${{ matrix.platform }}.${{ matrix.archive_ext }}

      - name: Verify offline wheel install (no network)
        run: |
          set -e
          PKG_DIR="aiguardx-offline-${{ matrix.platform }}"
          OFFLINE_DIR="${PKG_DIR}/_offline"

          echo "=== Checking bundled Python ==="
          PYTHON="${OFFLINE_DIR}/python/bin/python3"
          if [ ! -f "$PYTHON" ]; then
            echo "ERROR: Bundled Python not found at $PYTHON"
            exit 1
          fi
          chmod +x "$PYTHON"
          "$PYTHON" --version

          echo "=== Creating venv from bundled Python ==="
          "$PYTHON" -m venv /tmp/test-venv

          echo "=== Installing from offline wheels (no index) ==="
          /tmp/test-venv/bin/pip install \
            --no-index \
            --find-links "${OFFLINE_DIR}/wheels" \
            pip --quiet 2>/dev/null || true
          /tmp/test-venv/bin/pip install \
            --no-index \
            --find-links "${OFFLINE_DIR}/wheels" \
            mitmproxy requests cryptography --quiet

          echo "=== Verifying mitmdump ==="
          /tmp/test-venv/bin/mitmdump --version

          echo "=== Verifying Python imports ==="
          /tmp/test-venv/bin/python -c "
          import mitmproxy; print(f'mitmproxy {mitmproxy.__version__}')
          import requests; print(f'requests {requests.__version__}')
          import cryptography; print(f'cryptography {cryptography.__version__}')
          "

          echo "=== Checking agent binary ==="
          AGENT="${PKG_DIR}/agent-$(echo ${{ matrix.platform }} | cut -d- -f1)"
          if [ -f "$AGENT" ]; then
            chmod +x "$AGENT"
            file "$AGENT"
            echo "Agent binary present: OK"
          else
            echo "WARNING: Agent binary not found"
          fi

          echo "=== All checks passed ==="
