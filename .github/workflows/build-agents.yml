name: Build AISecShield Agents

on:
  workflow_dispatch:
    inputs:
      agent_version:
        description: "Agent version string"
        required: false
        default: "0.1.0"
  push:
    branches: [main, module_1]
    paths:
      - "agent/**"

permissions:
  contents: write

env:
  AGENT_VERSION: ${{ github.event.inputs.agent_version || '0.1.0' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            build_script: bash agent/build/build_linux.sh
            output_name: aisecshield
            artifact_name: aisecshield-linux-x86_64
          - os: macos-14
            platform: macos
            arch: arm64
            build_script: bash agent/build/build_macos.sh
            output_name: aisecshield
            artifact_name: aisecshield-macos-arm64
          - os: windows-latest
            platform: windows
            arch: x86_64
            build_script: python agent/build/build_windows.py --no-sign
            output_name: aisecshield.exe
            artifact_name: aisecshield-x86_64.exe

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies and PyInstaller
        shell: bash
        run: |
          cd agent
          uv sync --frozen --no-dev --no-install-project
          uv pip install pyinstaller
          echo "Dependencies installed successfully"

      - name: Build agent executable
        shell: bash
        run: |
          echo "Building AISecShield agent for ${{ matrix.platform }} (${{ matrix.arch }})"
          ${{ matrix.build_script }}

      - name: Rename and verify output
        shell: bash
        run: |
          SRC="agent/build/dist/${{ matrix.output_name }}"
          DEST="agent/build/dist/${{ matrix.artifact_name }}"

          if [ ! -f "$SRC" ]; then
            echo "ERROR: Build output not found at $SRC"
            ls -la agent/build/dist/ || true
            exit 1
          fi

          if [ "$SRC" != "$DEST" ]; then
            mv "$SRC" "$DEST"
          fi

          echo "Binary: $DEST"
          echo "Size: $(du -h "$DEST" | cut -f1)"

          if command -v sha256sum &>/dev/null; then
            CHECKSUM=$(sha256sum "$DEST" | cut -d' ' -f1)
          else
            CHECKSUM=$(shasum -a 256 "$DEST" | cut -d' ' -f1)
          fi

          echo "SHA256: $CHECKSUM"
          echo "$CHECKSUM  ${{ matrix.artifact_name }}" > "agent/build/dist/${{ matrix.artifact_name }}.sha256"

      - name: Build macOS PKG installer
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          bash agent/build/package_macos_pkg.sh \
            --version "${{ env.AGENT_VERSION }}" \
            --exe-path "agent/build/dist/${{ matrix.artifact_name }}" \
            --arch "${{ matrix.arch }}"
          echo "macOS PKG built successfully"
          ls -la agent/build/dist/*.pkg 2>/dev/null || echo "No PKG output found"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aisecshield-${{ matrix.platform }}
          path: |
            agent/build/dist/${{ matrix.artifact_name }}
            agent/build/dist/${{ matrix.artifact_name }}.sha256
            agent/build/dist/*.pkg
          retention-days: 30

  verify-builds:
    needs: build
    runs-on: ubuntu-latest
    name: Verify all builds

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify unique checksums
        run: |
          echo "=== AISecShield Agent Build Verification ==="
          echo ""

          CHECKSUMS=()
          for platform_dir in artifacts/aisecshield-*/; do
            platform=$(basename "$platform_dir" | sed 's/aisecshield-//')
            for sha_file in "$platform_dir"*.sha256; do
              if [ -f "$sha_file" ]; then
                checksum=$(cut -d' ' -f1 "$sha_file")
                binary_name=$(cut -d' ' -f3 "$sha_file")
                binary_path="${platform_dir}${binary_name}"
                size="unknown"
                if [ -f "$binary_path" ]; then
                  size=$(du -h "$binary_path" | cut -f1)
                fi
                echo "  $platform: $binary_name ($size) SHA256=$checksum"
                CHECKSUMS+=("$checksum")
              fi
            done
          done

          echo ""

          UNIQUE_COUNT=$(printf '%s\n' "${CHECKSUMS[@]}" | sort -u | wc -l)
          TOTAL_COUNT=${#CHECKSUMS[@]}

          if [ "$TOTAL_COUNT" -lt 2 ]; then
            echo "WARNING: Only $TOTAL_COUNT binary found. Expected 3 platform builds."
            exit 1
          fi

          if [ "$UNIQUE_COUNT" -ne "$TOTAL_COUNT" ]; then
            echo "FAIL: Found duplicate checksums across platform builds!"
            echo "  Total: $TOTAL_COUNT, Unique: $UNIQUE_COUNT"
            echo "  This indicates identical binaries across platforms."
            exit 1
          fi

          echo "PASS: All $TOTAL_COUNT builds have unique checksums."

  copy-to-static:
    needs: verify-builds
    runs-on: ubuntu-latest
    name: Commit binaries to static/agents

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Copy binaries to static/agents
        run: |
          mkdir -p backend/static/agents/linux
          mkdir -p backend/static/agents/macos
          mkdir -p backend/static/agents/windows

          if [ -f artifacts/aisecshield-linux/aisecshield-linux-x86_64 ]; then
            cp artifacts/aisecshield-linux/aisecshield-linux-x86_64 backend/static/agents/linux/
            chmod +x backend/static/agents/linux/aisecshield-linux-x86_64
            # Also copy as agent-linux for agent_views.py PLATFORM_EXECUTABLE compatibility
            cp artifacts/aisecshield-linux/aisecshield-linux-x86_64 backend/static/agents/agent-linux
            chmod +x backend/static/agents/agent-linux
            echo "Copied Linux binary"
          fi

          if [ -f artifacts/aisecshield-macos/aisecshield-macos-arm64 ]; then
            cp artifacts/aisecshield-macos/aisecshield-macos-arm64 backend/static/agents/macos/
            chmod +x backend/static/agents/macos/aisecshield-macos-arm64
            # Also copy as agent-macos for agent_views.py PLATFORM_EXECUTABLE compatibility
            cp artifacts/aisecshield-macos/aisecshield-macos-arm64 backend/static/agents/agent-macos
            chmod +x backend/static/agents/agent-macos
            echo "Copied macOS binary"
          fi

          if [ -f artifacts/aisecshield-windows/aisecshield-x86_64.exe ]; then
            cp artifacts/aisecshield-windows/aisecshield-x86_64.exe backend/static/agents/windows/
            # Also copy as agent-windows.exe for agent_views.py PLATFORM_EXECUTABLE compatibility
            cp artifacts/aisecshield-windows/aisecshield-x86_64.exe backend/static/agents/agent-windows.exe
            echo "Copied Windows binary"
          fi

          echo ""
          echo "=== Static agents directory ==="
          find backend/static/agents/ -type f -exec ls -lh {} \;

      - name: Remove stale binaries
        run: |
          rm -f backend/static/agents/windows/aisecshield.exe
          rm -f backend/static/agents/linux/aisecshield-x86_64
          rm -f backend/static/agents/linux/aisecshield-arm64

      - name: Commit updated binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/static/agents/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update AISecShield agent binaries for all platforms"
            git push
          fi
