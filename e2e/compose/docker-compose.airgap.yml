# Air-gap overlay for the CBOM posture proof stack.
# Use with the base file. Do not start this file alone.
#
#   docker compose -p dss-e2e \
#     -f e2e/compose/docker-compose.e2e.yml \
#     -f e2e/compose/docker-compose.airgap.yml \
#     --profile seed config
#
# The project network is internal. Backend and frontend publish no host ports.
# gateway, on the internal network and on edge, is the only publisher of the
# two loopback ports and forwards them to frontend:3000 and backend:8080.
# aibom-scan and scan-worker stay on network_mode: none.
#
# object-store keeps the tag minio/minio:RELEASE.2024-10-02T17-50-41Z because
# compose_policy.py allows that tag. Docker Hub and dl.min.io no longer serve
# it. Build the local stand-in before up:
#   docker build -t minio/minio:RELEASE.2024-10-02T17-50-41Z \
#     -f e2e/airgap/Dockerfile.object-store e2e/airgap
# pull_policy: never, so a missing local image fails instead of pulling.
services:
  backend:
    ports: !override []
    # Zip CI uploads land in the host moto store the scan worker already reads.
    # 172.20.0.1:59124 is a bridge-only forward to 127.0.0.1:59123.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AWS_ENDPOINT_URL_S3: http://172.20.0.1:59124
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      MONGO_HOST: dss-e2e-mongo
      MONGO_PORT: "27017"
  frontend:
    ports: !override []
  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: dss-e2e-rabbitmq
    labels:
      com.dss-e2e: "1"
    restart: "no"
    ports: !override []
  object-store:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    pull_policy: never
    container_name: dss-e2e-object-store
    labels:
      com.dss-e2e: "1"
    restart: "no"
    command: ["server", "/data"]
    ports: !override []
  scan-worker:
    image: dss-e2e/aibom-scan:local
    pull_policy: never
    container_name: dss-e2e-scan-worker
    labels:
      com.dss-e2e: "1"
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    ports: !override []
  gateway:
    image: dss-e2e/backend:local
    pull_policy: never
    container_name: dss-e2e-gateway
    labels:
      com.dss-e2e: "1"
    restart: "no"
    entrypoint: ["/backend/.venv/bin/python", "/e2e/airgap/gateway.py"]
    networks:
      - default
      - edge
    ports:
      - "127.0.0.1:43000:3000"
      - "127.0.0.1:43080:8080"
    volumes:
      - type: bind
        source: ../airgap
        target: /e2e/airgap
        read_only: true
        bind:
          create_host_path: false
  aibom-scan:
    volumes:
      - type: bind
        source: ../airgap
        target: /e2e/airgap
        read_only: true
        bind:
          create_host_path: false

networks:
  default:
    internal: true
  edge:
    labels:
      com.dss-e2e: "1"
