{{- if .Values.deployment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cbom-scan-node.fullname" . }}
  labels:
    {{- include "cbom-scan-node.labels" . | nindent 4 }}
    app.kubernetes.io/component: scan-node
spec:
  # one replica, replaced (never two at once): a node token and its signing key belong to exactly one process
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cbom-scan-node.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: scan-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cbom-scan-node.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: scan-node
      annotations:
        # a new registration token (after a Reset) restarts the node, so it reads it
        checksum/registration-token: {{ printf "%s/%s" (include "cbom-scan-node.secretName" .) .Values.registrationToken | sha256sum | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # the node never calls the Kubernetes API of the cluster it runs in (a cluster source brings its own kubeconfig)
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001   # makes the state volume writable for uid 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scan-node
          image: {{ include "cbom-scan-node.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "cbom-scan-node.commonEnv" . | nindent 12 }}
            - name: ZS_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cbom-scan-node.secretName" . }}
                  key: registration-token
                  optional: true   # only needed until the node has enrolled
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- include "cbom-scan-node.readiness" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/zs-node
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-state" (include "cbom-scan-node.fullname" .)) .Values.persistence.existingClaim }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
