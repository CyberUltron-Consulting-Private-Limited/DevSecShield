services:

  devsecshield-backend:
    container_name: devsecshield-backend
    image: devsec_back
    ports:
      - 9000:8080 
    volumes:
      - devsecshield-backend-data:/backend/data

  devsecshield-frontend:
    container_name: devsecshield-frontend
    image: devsec_front
    ports:
      - 4000:3000 # changed from 3002 to 4000 to avoid conflict with other services
    environment:
      # Server-side: API proxy route forwards to RedAmon webapp
      REDAMON_API_URL: http://redamon-webapp:3000
    networks:
      - redamon-network

networks:
  redamon-network:
    external: true


volumes:
  devsecshield-backend-data:
    driver: local
