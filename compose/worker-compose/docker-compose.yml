services:

  worker:
    container_name: devsecshield-scan-worker
    build:
      context: ../../RabbitMQ/worker
      dockerfile: Dockerfile
    image: devsecshield/scan-worker:local
    environment:
      IS_DOCKER_CONTAINER: "True"
    command: uv run celery -A scan_worker worker -P threads --loglevel=info -Q scan_worker_queue

  cicd_worker:
    container_name: devsecshield-cicd-worker
    build:
      context: ../../RabbitMQ/worker
      dockerfile: Dockerfile
    image: devsecshield/scan-worker:local
    environment:
      IS_DOCKER_CONTAINER: "True"
    command: uv run celery -A scan_worker worker -P threads --loglevel=info -Q cicd_worker_queue


  dast_worker:
    container_name: devsecshield-dast-worker
    build:
      context: ../../RabbitMQ/dast_worker
      dockerfile: Dockerfile
    image: devsecshield/dast-worker:local
    environment:
      IS_DOCKER_CONTAINER: "True"
    command: uv run celery -A dast_worker worker -P threads --loglevel=info -Q dast_worker_queue
