name: CBOM code scan
description: >
  Air-gapped CBOM scan of a repository. Fails the job when a high finding is
  present. Installs nothing on the scanned hosts and does not call the network
  during the scan.
inputs:
  path:
    description: Directory to scan, relative to the repository root.
    required: false
    default: .
  no-fail:
    description: Exit 0 even when high findings are present.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Scan the repository
      shell: bash
      working-directory: aibom
      env:
        SCAN_PATH: ${{ inputs.path }}
        NO_FAIL: ${{ inputs.no-fail }}
      run: |
        set -euo pipefail
        args=(cbom "$GITHUB_WORKSPACE/$SCAN_PATH")
        if [ "$NO_FAIL" = "true" ]; then
          args+=(--no-fail)
        fi
        uv run aibom "${args[@]}"
