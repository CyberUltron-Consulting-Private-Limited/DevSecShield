name: CBOM code scan gate

# Proves the composite action both ways:
#   allow  — a clean tree must exit 0
#   block  — a tree with high findings must exit non-zero, and this job
#            fails if the gate lets that tree through
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/actions/cbom-scan/**"
      - ".github/workflows/cbom-code-scan.yml"
      - "aibom/src/aibom/cli.py"
      - "aibom/src/aibom/cbom/gate.py"
      - "aibom/src/aibom/cbom/advisories.py"
      - "aibom/src/aibom/cbom/data/crypto_advisories.json"
      - "aibom/tests/fixtures/code-supply/**"
  push:
    branches: [main, develop, ansh]
    paths:
      - ".github/actions/cbom-scan/**"
      - ".github/workflows/cbom-code-scan.yml"
      - "aibom/src/aibom/cli.py"
      - "aibom/src/aibom/cbom/gate.py"
      - "aibom/src/aibom/cbom/advisories.py"
      - "aibom/src/aibom/cbom/data/crypto_advisories.json"
      - "aibom/tests/fixtures/code-supply/**"

jobs:
  allow:
    name: Clean tree is allowed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cbom-scan
        with:
          path: aibom/tests/fixtures/code-supply/clean

  block:
    name: Vulnerable tree is blocked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: gate
        continue-on-error: true
        uses: ./.github/actions/cbom-scan
        with:
          path: aibom/tests/fixtures/code-supply/vulnerable
      - name: The gate must have failed the vulnerable tree
        if: steps.gate.outcome != 'failure'
        run: |
          echo "GATE DID NOT BLOCK (outcome=${{ steps.gate.outcome }})"
          exit 1
      - name: Record the block
        if: steps.gate.outcome == 'failure'
        run: echo "GATE BLOCKED vulnerable tree (outcome=failure)"
