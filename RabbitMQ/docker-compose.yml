services:
  
  # celery_worker:
  #   build: worker
  #   container_name: celery_worker
  #   image: worker:latest
  
  rabbitmq:
    image: rabbitmq:4.1.6-management-alpine
    container_name: rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_ADMIN_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_ADMIN_PASSWORD}
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."  

volumes:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local