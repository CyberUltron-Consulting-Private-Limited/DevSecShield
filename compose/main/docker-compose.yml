services:

  devsecshield-backend:
    container_name: devsecshield-backend
    image: ghcr.io/cyberultron-nikhil/devsecshield-backend:v0
    ports:
      - 8082:8080
    volumes:
      - devsecshield-backend-data:/backend/data

  devsecshield-frontend:
    container_name: devsecshield-frontend
    image: ghcr.io/cyberultron-nikhil/devsecshield-frontend:v0
    environment:
      IS_DOCKER_CONTAINER: "True"
    ports:
      - 3002:3000


volumes:
  devsecshield-backend-data:
    driver: local
