guideline:
  title: SEBI Cybersecurity and Cyber Resilience Framework (CSCRF)
  circular: SEBI/HO/ITD-1/ITD_CSC_EXT/P/CIR/2024/113
  dated: '2024-08-20'
  version: '1.0'
  disclaimer: >-
    Advisory alignment to SEBI CSCRF Circular SEBI/HO/ITD-1/ITD_CSC_EXT/P/CIR/2024/113
    dated 20.08.2024. Does not constitute SEBI certification, audit opinion, or
    satisfaction of SEBI / stock-exchange obligations. BOM evidence supports
    readiness assessment only.
frameworks:
  sebi_cscrf_cbom:
    label: SEBI CSCRF (CBOM)
    lane: cbom
  sebi_cscrf_aibom:
    label: SEBI CSCRF (AIBOM)
    lane: aibom
  sebi_cscrf_sbom:
    label: SEBI CSCRF (SBOM)
    lane: sbom
scope_exclusions:
  full_soc: Market SOC / C-SOC continuous monitoring is process evidence (manual/NBE).
  full_cci: Cyber Capability Index dashboards are out of BOM auto scope.
  ai_specific: CIR has no AI/ML/AIBOM controls; AIBOM lane is software-inventory reading only.
  qbom: No QBOM product scan type.
