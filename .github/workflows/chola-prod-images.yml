# The Chola production images of ONE commit, as workflow artifacts the deploy kit can read through the GitHub API
# (deploy/chola-prod/README.md, "Images from a CI run"): a machine that cannot pull private GHCR packages or Docker Hub
# runs `scripts/deploy/chola-prod.sh deploy --sha <sha> --from-run <run id>` with only `gh api` and crane.
#
#   chola-image-backend, chola-image-scan-worker, chola-image-dast-worker
#       the images publish-ghcr.yml already published for the commit (dev-, staging- or manual-<sha12>, the tags the
#       kit reads), their linux/amd64 manifest copied byte for byte (crane pull --format=oci: same digest in ECR)
#   chola-image-frontend
#       the frontend built here for linux/amd64 with NEXT_PUBLIC_BACKEND_URL=https://chola-api.zeroshield.ai, as the
#       kit builds it (the GHCR frontends carry another API URL)
#   chola-infra       release.tar.gz: docker save of the kit's digest-pinned infrastructure images (INFRA_IMAGES)
#   chola-manifest    manifest.json: the commit, each image's source ref, index and linux/amd64 digests and its
#                     org.opencontainers.image.revision label (deploy/chola-prod/artifacts.py writes and checks it)
#
# Every image artifact is an OCI image layout (compressed layers, uploaded without a second compression), checked by
# artifacts.py oci-check before upload (one linux/amd64 image, every blob's sha256, revision = the commit). Kept 3 days.
#
# Triggers: workflow_dispatch with the full commit (GitHub offers a dispatch only for workflows on the default
# branch), or a push of a branch named chola-prod-images/<40-hex commit> (works from any branch that has this file;
# delete the branch afterwards). Neither pushes anything anywhere: the token can only read the repository and packages.
# The helper scripts come from THIS workflow's commit; the target commit is only checked out as the frontend's build
# context.
name: Chola production images

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character commit SHA whose images to package (its GHCR images must exist)"
        type: string
        required: true
  push:
    branches: ["chola-prod-images/**"]

permissions: {}

concurrency:
  group: chola-prod-images-${{ inputs.sha || github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: images
    runs-on: dss-vm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      API_URL: https://chola-api.zeroshield.ai
      CRANE_VERSION: v0.22.1
      # go-containerregistry_Linux_x86_64.tar.gz of CRANE_VERSION (its checksums.txt); scripts/deploy/chola-prod.sh
      # pins the same (tested)
      CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
      # the kit's INFRA_IMAGES (scripts/deploy/chola-prod.sh; tested to be equal)
      INFRA_IMAGES: >-
        postgres:15-alpine@sha256:e18480a22d6e48f4d816a6696769b1ec09ac73a824c5649e49c7d8b684913f3d
        mongo:8.0.6@sha256:ab6556e6d71d9773dd74002db924dc637abb49d079d6ef945982af3078fdf22c
        rabbitmq:4.1-management-alpine@sha256:71dc98bb14d16c7240efc1d9b6356e5ac1470a51c63e8cce16f246e09748a995
        nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
        qdrant/qdrant:v1.13.5@sha256:7c648cc0883113b2046d6def26da345b61a8e4caa16b0df206eacc01d516bdda
    steps:
      - name: Commit
        id: commit
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            workflow_dispatch) sha=$INPUT_SHA ;;
            push) sha=${REF_NAME#chola-prod-images/} ;;
            *) echo "::error::event $EVENT does not package images"; exit 1 ;;
          esac
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::'$sha' is not a full 40-character lowercase commit SHA"
            exit 1
          fi
          out="$RUNNER_TEMP/chola"
          rm -rf "${out:?}"
          mkdir -p "$out"
          printf 'sha=%s\nsha12=%s\nout=%s\n' "$sha" "${sha:0:12}" "$out" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout (this workflow's commit, for the kit's helpers)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: tools
          sparse-checkout: deploy/chola-prod

      - name: Checkout the commit (the frontend's build context)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.commit.outputs.sha }}
          path: target
          sparse-checkout: frontend

      # The self-hosted runners share one long-lived BuildKit builder (dss-vm-builder, docker-container driver, which
      # can write an OCI layout); GitHub's runners create one per job.
      - name: Set up Docker Buildx
        id: buildx
        if: runner.environment == 'github-hosted'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: crane (pinned, sha256 checked)
        env:
          OUT: ${{ steps.commit.outputs.out }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT/bin"
          asset=go-containerregistry_Linux_x86_64.tar.gz
          curl -fsSL --retry 3 -o "$OUT/$asset" \
            "https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION/$asset"
          echo "$CRANE_SHA256  $OUT/$asset" | sha256sum -c -
          tar -xzf "$OUT/$asset" -C "$OUT/bin" crane
          rm -f "$OUT/$asset"
          echo "$OUT/bin" >> "$GITHUB_PATH"

      # crane's registry login lives in this run's own config, never in the shared runner's ~/.docker
      - name: Log in to GHCR (crane, read-only token)
        env:
          OUT: ${{ steps.commit.outputs.out }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT/crane-config"
          printf '%s' "$GH_TOKEN" | DOCKER_CONFIG="$OUT/crane-config" crane auth login ghcr.io -u "$ACTOR" --password-stdin

      - name: Manifest
        env:
          OUT: ${{ steps.commit.outputs.out }}
          SHA: ${{ steps.commit.outputs.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT/manifest"
          python3 -I tools/deploy/chola-prod/artifacts.py manifest-init --out "$OUT/manifest/manifest.json" \
            --commit "$SHA" --api-url "$API_URL" --repository "$REPO" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --ref "$REF"

      - name: Backend and workers from GHCR (linux/amd64, byte for byte)
        env:
          OUT: ${{ steps.commit.outputs.out }}
          SHA: ${{ steps.commit.outputs.sha }}
          SHA12: ${{ steps.commit.outputs.sha12 }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$OUT/crane-config"
          registry="ghcr.io/${OWNER,,}"
          tag=""
          for t in "dev-$SHA12" "staging-$SHA12" "manual-$SHA12"; do
            if crane digest "$registry/devsecshield-backend:$t" > /dev/null 2>&1; then tag=$t; break; fi
          done
          if [ -z "$tag" ]; then
            echo "::error::no GHCR images for $SHA12 (dev-, staging- or manual-$SHA12): is the commit on dev or staging and its 'Publish images (GHCR)' run green?"
            exit 1
          fi
          echo "GHCR images of $SHA12: $registry/devsecshield-*:$tag" | tee -a "$GITHUB_STEP_SUMMARY"
          for c in backend scan-worker dast-worker; do
            ref="$registry/devsecshield-$c:$tag"
            index=$(crane digest "$ref")
            crane pull --format=oci --platform linux/amd64 "$ref" "$OUT/image-$c"
            # checks the layout (one linux/amd64 image, every blob) and that its revision label is this commit
            python3 -I tools/deploy/chola-prod/artifacts.py manifest-add-image --manifest "$OUT/manifest/manifest.json" \
              --component "$c" --artifact "chola-image-$c" --source "$ref" --layout "$OUT/image-$c" --index-digest "$index" |
              tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Frontend for the Chola API (linux/amd64, as the kit builds it)
        env:
          OUT: ${{ steps.commit.outputs.out }}
          SHA: ${{ steps.commit.outputs.sha }}
          BUILDER: ${{ runner.environment == 'self-hosted' && 'dss-vm-builder' || steps.buildx.outputs.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          docker buildx build --builder "$BUILDER" --platform linux/amd64 \
            --build-arg "NEXT_PUBLIC_BACKEND_URL=$API_URL" \
            --label "org.opencontainers.image.revision=$SHA" --label "com.zeroshield.devsecshield.api-url=$API_URL" \
            --provenance=false --sbom=false --output "type=oci,dest=$OUT/frontend-oci.tar" target/frontend
          mkdir -p "$OUT/image-frontend"
          tar -xf "$OUT/frontend-oci.tar" -C "$OUT/image-frontend"
          rm -f "$OUT/frontend-oci.tar"
          python3 -I tools/deploy/chola-prod/artifacts.py oci-check --normalize --layout "$OUT/image-frontend" \
            --revision "$SHA" --label "com.zeroshield.devsecshield.api-url=$API_URL"
          # the API URL is inlined into the browser chunks: refuse a bundle without it (the instance checks again)
          hits=0
          for blob in "$OUT"/image-frontend/blobs/sha256/*; do
            if tar -tzf "$blob" > /dev/null 2>&1; then
              n=$(tar -xzOf "$blob" --wildcards 'frontend/.next/static/*' 2> /dev/null | grep -acF "$API_URL" || true)
              hits=$((hits + ${n:-0}))
            fi
          done
          if [ "$hits" -lt 1 ]; then echo "::error::the frontend bundle does not contain $API_URL"; exit 1; fi
          echo "frontend: $API_URL is in the browser bundle ($hits chunks)"
          python3 -I tools/deploy/chola-prod/artifacts.py manifest-add-image --manifest "$OUT/manifest/manifest.json" \
            --component frontend --artifact chola-image-frontend --source "built in $RUN_URL" \
            --layout "$OUT/image-frontend" | tee -a "$GITHUB_STEP_SUMMARY"

      # As the kit's own infra step: pulled by digest, tagged with the name the compose file runs, saved for linux/amd64
      # (docker save --platform exists only with the containerd image store), compressed (docker load reads it so).
      - name: Infrastructure release archive
        env:
          OUT: ${{ steps.commit.outputs.out }}
        run: |
          set -euo pipefail
          read -r -a images <<< "$INFRA_IMAGES"
          tags=()
          for i in "${images[@]}"; do
            docker pull -q --platform linux/amd64 "$i" > /dev/null
            docker tag "$i" "${i%%@*}"
            tags+=("${i%%@*}")
          done
          plat=()
          if docker info --format '{{json .DriverStatus}}' 2> /dev/null | grep -q io.containerd.snapshotter &&
            docker save --help 2> /dev/null | grep -q -- '--platform'; then
            plat=(--platform linux/amd64)
          fi
          iplat=()
          if [ ${#plat[@]} -gt 0 ] && docker image inspect --help 2> /dev/null | grep -q -- '--platform'; then
            iplat=(--platform linux/amd64)
          fi
          for t in "${tags[@]}"; do
            arch=$(docker image inspect ${iplat[@]+"${iplat[@]}"} -f '{{.Os}}/{{.Architecture}}' "$t")
            [ "$arch" = linux/amd64 ] || { echo "::error::$t is $arch, not linux/amd64"; exit 1; }
          done
          mkdir -p "$OUT/infra"
          docker save ${plat[@]+"${plat[@]}"} "${tags[@]}" | gzip -6 > "$OUT/infra/release.tar.gz"
          args=()
          for i in "${images[@]}"; do args+=(--image "$i"); done
          python3 -I tools/deploy/chola-prod/artifacts.py manifest-set-infra --manifest "$OUT/manifest/manifest.json" \
            --artifact chola-infra --file "$OUT/infra/release.tar.gz" "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      # The deploy machine extracts one artifact at a time while it downloads (no zip on disk); what it needs is about
      # the largest artifact. GitHub takes artifacts of several GB (deploy-staging.yml uploads ~5 GB in one); this
      # guard keeps each one well below that.
      - name: Artifact sizes
        env:
          OUT: ${{ steps.commit.outputs.out }}
          MAX_BYTES: "4294967296"
        run: |
          set -euo pipefail
          for d in manifest image-backend image-frontend image-scan-worker image-dast-worker infra; do
            n=$(du -sb "$OUT/$d" | cut -f1)
            echo "$d: $((n / 1048576)) MB" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$n" -gt "$MAX_BYTES" ]; then echo "::error::$d is $n bytes, over $MAX_BYTES"; exit 1; fi
          done

      - name: Upload manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chola-manifest
          path: ${{ steps.commit.outputs.out }}/manifest/manifest.json
          retention-days: 3
          if-no-files-found: error
      - name: Upload backend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chola-image-backend
          path: ${{ steps.commit.outputs.out }}/image-backend
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Upload frontend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chola-image-frontend
          path: ${{ steps.commit.outputs.out }}/image-frontend
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Upload scan-worker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chola-image-scan-worker
          path: ${{ steps.commit.outputs.out }}/image-scan-worker
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Upload dast-worker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chola-image-dast-worker
          path: ${{ steps.commit.outputs.out }}/image-dast-worker
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Upload infrastructure archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chola-infra
          path: ${{ steps.commit.outputs.out }}/infra/release.tar.gz
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

      # The runner outlives the job: this run's layouts, archive, crane and its login go (the layer cache stays).
      - name: Clean up
        if: always()
        env:
          OUT: ${{ steps.commit.outputs.out }}
        run: |
          if [ -n "$OUT" ]; then rm -rf "${OUT:?}"; fi
