# Risk weights for the CBOM scorer (config-driven; edit without touching code).
#
# A peer of risk-weights.yaml for the crypto lane. The CBOM scanners EMIT flags
# (C5 weak-crypto, C6 quantum-vulnerable, the C8 expired-certificate); this file
# WEIGHTS them into a per-component severity. Per-component flags STACK exactly
# as in the AIBOM scorer: the scorer sums every flag raised against a crypto
# asset, then maps the stacked raw weight to a severity band. So an RSA-1024 key
# that is BOTH weak-by-size (8) AND quantum-vulnerable (4) sums to 12 -> high.

default: 1          # weight for any flag not listed below

flags:
  # ── weak crypto -> HIGH (a present-day break; SARIF error) ──
  WEAK_ALGORITHM: 8       # MD5/SHA-1/DES/3DES/RC4/RC2/Blowfish (deprecated corpus)
  WEAK_CIPHER_MODE: 8     # ECB — leaks plaintext structure
  WEAK_KEY_SIZE: 8        # RSA/DSA/DH below the 2048-bit floor
  WEAK_PROTOCOL: 8        # TLS < 1.2 / SSL (RFC 8996)
  WEAK_CIPHER_SUITE: 8    # NULL/anon/EXPORT/RC4/DES/3DES suite, weak SSH/IKE (C13)
  WEAK_PADDING: 8         # RSA PKCS#1 v1.5 / textbook encryption — CWE-780 (C16)
  EXPIRED_CERTIFICATE: 8  # an X.509 certificate past notValidAfter
  WEAK_CERTIFICATE_SIGNATURE: 8  # cert signed with MD5/SHA-1 — forgeable (C4)
  WEAK_CERTIFICATE_KEY: 8        # cert public key below the asymmetric floor (C4)
  # ── C6 crypto-material misuse -> HIGH (present-day breaks) ──
  WEAK_RNG: 8             # key/IV/nonce/salt from a non-crypto PRNG (CWE-338)
  STATIC_IV: 8            # constant/predictable IV or nonce reaching a cipher (CWE-329)
  REUSED_NONCE: 8         # same static IV/nonce securing >1 encryption (CWE-323)
  HARDCODED_KEY: 8        # symmetric/private key embedded as a source literal (CWE-321)
  VULNERABLE_CRYPTO_LIBRARY: 8  # locked or declared version matches the offline advisory file
  CUSTOM_CRYPTO: 4        # private algorithm constants (CWE-1240); reported, does not fail CI
  # ── quantum-vulnerable / trust smell -> MEDIUM (a future/latent risk; SARIF warning) ──
  QUANTUM_VULNERABLE: 4   # RSA/ECC/DH/DSA — harvest-now-decrypt-later; PQC migration
  SELF_SIGNED_LEAF: 4     # self-signed end-entity cert — a production trust smell (C4)
  # ── posture findings (config and IaC). Weights follow the SARIF bands. ──
  UNENCRYPTED_AT_REST: 8
  UNENCRYPTED_IN_TRANSIT: 8
  PLAINTEXT_LISTENER: 4
  TLS_VERIFICATION_DISABLED: 8
  DOWNGRADE_PROTECTION_MISSING: 4
  KNOWN_TLS_VULNERABILITY: 8
  KMS_KEY_ROTATION_DISABLED: 4
  KMS_KEY_POLICY_PUBLIC: 8
  KMS_KEY_DELETION_UNPROTECTED: 1
  AT_REST_ENCRYPTION_WEAK: 4

# Per-component SEVERITY bands, on the STACKED raw weight (inclusive lower bound).
# A crypto asset with no flags scores 0 -> low (the inventory floor; a strong
# RSA-2048-without-the-q-v-flag, AES-GCM, SHA-256, a valid certificate).
severity:
  critical: 13      # >= 13 -> critical (heavy stacking, e.g. expired+weak cert = 16)
  high: 8           # >= 8  -> high     (any weak crypto, or an expired certificate)
  medium: 4         # >= 4  -> medium   (quantum-vulnerable but otherwise strong)
  low: 1            # >= 1  -> low

# Global 0-100 score SCALE (same LOCKED formula as the AIBOM scorer):
#   risk_normalized = min(100, round(risk_total / max_raw * 100, 1))
# `max_raw` omitted -> auto-computed as the sum of the flag weights above.
scale:
  max_raw: 112      # Base_Commit weight sum. Do not let new flags rescore old scans.
  bands:
    low: 33         # 0-33  -> low
    medium: 66      # 34-66 -> medium;  67-100 -> high
