# ZeroShield CBOM scan node.  The command on CBOM Sources > Scan nodes sets image, apiUrl, registrationToken and
# (optionally) httpsProxy; "Create agent pool token" gives the DaemonSet command (agent.enabled, agent.poolToken).

image:
  # A placeholder: the name the downloaded image file loads as (docker load). "localhost/" can never resolve to a
  # public registry. Push the image to a registry your cluster pulls from and set its name here; the chart refuses to
  # render with this placeholder unless pullPolicy is Never (the image loaded on every node by hand).
  repository: localhost/zeroshield/cbom-scan-node
  tag: ""            # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# ZeroShield API URL (https://). Required.
apiUrl: ""
# Lab only: allow an http:// apiUrl (credentials would travel unencrypted).
allowInsecureHttp: false

# Single-use registration token from "Add scan node" (only needed until the node has enrolled). Stored in a Secret
# this chart creates; or name your own Secret (key: registration-token) in existingSecret. A new value (after a
# Reset) restarts the node so it reads it (checksum annotation); with existingSecret, restart the Deployment.
registrationToken: ""
existingSecret: ""

# Outbound proxy to ZeroShield (targets are always reached directly).
httpsProxy: ""
noProxy: ""

# Extra environment for the node (for example ZS_VAULT_PATH_PREFIX, VAULT_ADDR, ZS_MAX_JOBS, ZS_CA_FILE).
extraEnv: []

# The agentless node: reaches your servers, clusters, databases and networks with the credentials you store.
deployment:
  enabled: true

# Node state (enrollment, SSH key, request-signing key). One replica only: two pods must never share a node token.
persistence:
  size: 1Gi
  storageClass: ""      # "" = the cluster default
  existingClaim: ""

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 512Mi}
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

# Agent mode: one pod per Kubernetes node (DaemonSet). Each pod reads ONLY its own node from read-only host mounts,
# enrolls as its own scan node named after the Kubernetes node, and is never given a credential.
agent:
  enabled: false
  # Agent pool token from "Create agent pool token" (zsp_...); or name your own Secret (key: pool-token). A new value
  # restarts the pods (checksum annotation), so a pod whose node was reset or deleted after the old token expired or
  # was revoked enrolls with the new one; with existingSecret, run `kubectl rollout restart` after changing it.
  poolToken: ""
  existingSecret: ""
  # The host's / is mounted read-only at /host inside the pod (recursively read-only where the cluster supports it:
  # Kubernetes 1.31+ with a runtime that can, e.g. containerd 2.0).
  hostRoot: /
  # Host directories (under hostRoot) hidden behind empty read-only mounts: the kernel and runtime file systems the
  # agent never reads. Without recursive read-only mounts they would stay writable under /host, and /run holds the
  # container runtime's sockets. Every path must exist on every node. Add others your nodes have (for example
  # /var/lib/kubelet, whose pod volumes hold other pods' secrets) to keep them out of the agent's reach.
  hiddenHostPaths: [/proc, /sys, /dev, /run]
  # Per-node state on the host (the node token survives pod restarts, so a pod does not enroll again). Empty: one
  # directory per release, /var/lib/zs-node-agent/<namespace>.<release>, so two releases never share a node identity.
  statePath: ""
  # Share the host's PID namespace to read which crypto libraries running processes have loaded.
  hostPID: false
  # Run as root (uid 0, read-only mounts, only CAP_DAC_READ_SEARCH added) to read root-only files (for example
  # /etc/kubernetes/pki/*.key: only the public half, key type and size leave the node) and the library maps of other
  # root processes. Default: uid 10001, world-readable files only; the rest is reported as not readable.
  runAsRoot: false
  # With runAsRoot and hostPID: also add CAP_SYS_PTRACE, which the kernel requires to read the library map
  # (/proc/<pid>/maps) of a process owned by another user. Risk: SYS_PTRACE also lets a process attach to and read
  # the memory of every process on the node; the agent only reads maps, but a compromised agent could do more. A host
  # AppArmor or SELinux policy may still refuse it (reported as not readable).
  sysPtrace: false
  resources:
    requests: {cpu: 20m, memory: 96Mi}
    limits: {memory: 384Mi}
  nodeSelector: {}
  # Run on every node, control-plane nodes included.
  tolerations:
    - operator: Exists
  priorityClassName: ""
