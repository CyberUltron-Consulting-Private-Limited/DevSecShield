name: AI-BOM Regression Gates

# Blocks merges on the two regressions we never want back:
#   (a) model-recall (and provider/framework recall) dropping below the
#       differential thresholds vs the committed reference-tool oracles, and
#   (b) any results-page chart being able to go EMPTY (the chart-data contract).
# Plus a golden-lock so an unintended change to an emitted BOM fails the build.
#
# The 71 MB `chroma` fixture is a git-ignored upstream clone (tests/fixtures/CHROMA.md),
# so it is ABSENT in CI: the differential + contract suites skip their chroma
# cases automatically and gate on the committed `synthetic` / `trusera-demo`
# fixtures — which is exactly where a real regression would surface.

on:
  push:
    branches: [main, develop, module_1, ansh]
    paths:
      - "aibom/**"
      - "backend/utilities/dashboard/scan.py"
      - ".github/workflows/aibom-gates.yml"
  pull_request:
    branches: [main, develop, module_1, ansh]
    paths:
      - "aibom/**"
      - "backend/utilities/dashboard/scan.py"
      - ".github/workflows/aibom-gates.yml"

jobs:
  aibom-gates:
    name: AI-BOM regression gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aibom
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install aibom (+ test deps)
        run: uv sync --all-extras --dev || uv sync

      # Gate (a): detection parity — model/provider/framework recall vs the
      # committed Trusera/Cisco oracles must stay at/above threshold. chroma
      # cells self-skip (clone absent); a model-recall regression on the
      # committed fixtures fails the build.
      - name: Gate A — differential recall thresholds
        run: uv run --with pytest python -m pytest tests/test_differential.py -v

      # Gate (b): chart-data contract — the results-page charts (OWASP /
      # severity / compliance) must carry non-empty arrays, the severity chart
      # must show a real multi-level breakdown (not flat all-Low), and our
      # dashboard must keep dimension-parity with Trusera (severity / component
      # type / OWASP / provider / license / risk-per-finding). Any empty or
      # dropped chart dimension fails the build.
      - name: Gate B — chart-data contract + Trusera dimension parity (no empty charts)
        run: >-
          uv run --with pytest python -m pytest
          tests/test_chart_data_contract.py
          tests/test_chart_data_contract_full.py
          tests/test_chart_contract_severity.py
          tests/test_dimension_parity.py -v

      # Golden lock: emitted CycloneDX / SPDX / SARIF must match the committed
      # goldens. Unintended BOM drift fails the build.
      - name: Gate C — golden lock (CycloneDX / SPDX / SARIF)
        run: uv run --with pytest python -m pytest tests/test_emit.py tests/test_spdx.py tests/test_sarif.py tests/test_parity.py -v

      # Gate (d): compliance tri-state — OUT_OF_SCOPE must never silently become
      # FAIL (coverage = pass/(pass+fail) excludes the other states). The clinical
      # fixture yields real GMLP/EU/FDA pass/fail; chroma's medical frameworks
      # self-skip when the clone is absent (asserted on the nightly).
      - name: Gate D — compliance tri-state (out-of-scope != fail)
        run: >-
          uv run --with pytest python -m pytest
          tests/test_compliance.py
          tests/test_compliance_na.py
          tests/test_compliance_tristate.py -v

      # Gate (e): benchmark true-miss gate (P7, hermetic) + model recall. Ours vs
      # the FROZEN Trusera+Cisco oracles on the synthetic fixture must have ZERO
      # true-positive misses (FP-triaged), and must hit full model recall vs the
      # synthetic ground-truth manifest.
      - name: Gate E — benchmark true-miss + model recall (hermetic / synthetic)
        run: >-
          uv run --with pytest python -m pytest
          tests/test_benchmark_gate.py
          tests/test_model_recall.py -v

      # Gate (f): the same P7 true-miss gate on 2 representative REAL repos
      # (hf-model, tf-bedrock) cloned at a pinned SHA, diffed vs frozen oracles.
      # The full 10-repo LIVE benchmark runs on aibom-nightly.yml.
      - name: Gate F — true-miss gate on representative repos (pinned SHA)
        run: bash bench/ci_repos.sh
