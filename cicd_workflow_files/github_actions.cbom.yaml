name: CBOM Check
on:
  push:
    branches: [ main ]  # Adjust this to your master branch name
  pull_request:
    branches: [ main ]  # Optionally run on PRs
jobs:
  cbom-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Everything but .git is scanned (vendored code, build output and nested archives included); installed
      # dependency trees stay out. The zip is written outside the workspace. Uploads are capped at 50 MB.
      - name: Create project zip
        run: |
          zip -q -r "$RUNNER_TEMP/project.zip" . -x '.git/*' '*/.git/*' 'node_modules/*' '*/node_modules/*' 'venv/*' '.venv/*' '*/.venv/*'

      - name: Perform CBOM Scan
        id: cbom
        env:
          CICD_API_KEY: ${{ secrets.CICD_API_KEY }}
        run: |
          set -u
          # A failed scan fails the pipeline: --fail-with-body (curl 7.76+) exits non-zero on any HTTP error and still
          # prints the reason. 429 (rate limited): wait Retry-After seconds (30 if absent, 300 at most), up to 5 tries.
          for attempt in 1 2 3 4 5; do
            rc=0
            code=$(curl --fail-with-body -sS --max-time 900 -o response.json -D devsecshield-headers.txt -w '%{http_code}' \
              -H "cicd-api-key: $CICD_API_KEY" -F "zip_file=@$RUNNER_TEMP/project.zip" \
              "https://devsecshieldapi.zeroshield.ai/cicd/cbom/scan") || rc=$?
            if [ "${code}" = "429" ] && [ "${attempt}" -lt 5 ]; then
              delay=$(awk 'tolower($1) == "retry-after:" {print $2 + 0}' devsecshield-headers.txt | tail -n 1)
              [ -n "${delay}" ] && [ "${delay}" -gt 0 ] || delay=30
              [ "${delay}" -le 300 ] || delay=300
              echo "DevSecShield is rate limiting this key; retrying in ${delay}s (attempt ${attempt} of 5)"
              sleep "${delay}"
              continue
            fi
            break
          done
          if [ "${rc}" -ne 0 ]; then
            echo "DevSecShield scan failed (curl exit ${rc}, HTTP ${code:-none}):"
            cat response.json 2>/dev/null || true
            exit 1
          fi
          echo "CBOM findings: $(jq '.finding_count // 0' response.json)"
          jq -r '(.results | if type == "object" then (.results // []) elif type == "array" then . else [] end)[] | (.impact // "unknown") + " " + (.title // .name // "")' response.json

      # Fails the job when the team's CBOM policy blocks a finding (by default a high crypto finding, a banned
      # algorithm or a key below the SP 800-131A Rev. 2 minimum: RSA/DSA/DH 2048, EC 224), and when the answer has no
      # verdict. Each failing finding names the rule it broke; 112-bit keys (allowed through 2030) and
      # quantum-vulnerable findings are warnings unless the policy fails them.
      - name: CBOM policy gate
        run: |
          jq -r '"CBOM policy: " + (.gate.policy // "none") + " (" + (.gate.policy_source // "default") + ")"' response.json
          jq -r '.gate.reason // "No CBOM policy verdict in the answer."' response.json
          jq -r '.gate.failing[]? | "\(.impact // "High") \(.codes | join(",")) \(.location)\(if .line then ":\(.line)" else "" end) \(.title) [\([.rules[]? | select(.outcome == "fail") | .rule] | join(","))]"' response.json
          jq -r '.gate.warnings[]? | "warning: \(.title) \(.location) [\([.rules[]? | .rule] | join(","))]"' response.json
          # CBOM policy gate: fail when the team's CBOM policy blocks a finding, and fail closed when the answer carries no verdict.
          summary=$(grep -o '"gate_summary":"[^"]*"' response.json | head -n 1 | sed 's/^"gate_summary":"//; s/"$//')
          if [ -n "${summary}" ]; then echo "DevSecShield CBOM policy verdict: ${summary}"; fi
          if grep -Eq '"gate_failed"[[:space:]]*:[[:space:]]*true' response.json; then
            echo "DevSecShield CBOM policy gate: FAILED (findings the CBOM policy blocks, or no result in time; see the list above and the CI/CD page)"
            exit 1
          elif grep -Eq '"gate_failed"[[:space:]]*:[[:space:]]*false' response.json; then
            echo "DevSecShield CBOM policy gate: passed (nothing the CBOM policy blocks)"
          else
            echo "DevSecShield CBOM policy gate: the answer has no verdict, so the job fails (fail closed)"
            exit 1
          fi
