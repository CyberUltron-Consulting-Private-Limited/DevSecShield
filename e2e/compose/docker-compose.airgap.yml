# Air-gap overlay for the CBOM posture proof stack.
# Use with the base file. Do not start this file alone.
#
#   docker compose -p dss-e2e \
#     -f e2e/compose/docker-compose.e2e.yml \
#     -f e2e/compose/docker-compose.airgap.yml \
#     --profile seed config
#
# Backend and frontend publish no host ports. The project network is internal.
# aibom-scan and scan-worker stay on network_mode: none.
services:
  backend:
    ports: !override []
  frontend:
    ports: !override []
  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: dss-e2e-rabbitmq
    labels:
      com.dss-e2e: "1"
    restart: "no"
    ports: !override []
  object-store:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: dss-e2e-object-store
    labels:
      com.dss-e2e: "1"
    restart: "no"
    command: ["server", "/data"]
    ports: !override []
  scan-worker:
    image: dss-e2e/aibom-scan:local
    pull_policy: never
    container_name: dss-e2e-scan-worker
    labels:
      com.dss-e2e: "1"
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    ports: !override []

networks:
  default:
    internal: true
