# Strict known-fail ledger of the CBOM Tier-L gate (DEVILS-ADVOCATE.md §4.1, §4.4; INTERFACES.md §9).
# Base: dev 83b570b. Every row names the checks it covers (match), the track that flips it (owner) and an issue.
#   * a failing check no row matches fails the gate;
#   * a row whose checks all pass is STALE and fails the gate: the PR that fixed it deletes the row;
#   * a row that matches nothing, or only NOT-RUN checks, fails the gate unless it says not_run_ok.
# Match keys: any check subject key, or id/gate/kind/reason/verdict; a list means "any of"; <key>_prefix matches a
# string prefix. Run `cd e2e/cbom && python3 -m harness.gate judge <run>` to see which rows a run holds.

