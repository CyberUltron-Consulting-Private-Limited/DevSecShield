# Strict known-fail ledger v3 of the CBOM Tier-L gate (DEVILS-ADVOCATE.md §4.1/§4.4; INTERFACES.md §9, v7 §B, v7.3).
# Rows pin IDENTITIES, not counts (review 5878413538): each `expect` entry is one check this row tolerates, as
# harness/identity.py normalises it (asset ids -> type@location, job ids -> source, lab dates relative to the oracle's
# generated_at, digests/serials/fingerprints -> <hex:N>/<ssh-fp>), with its verdict (FAIL by default, NOT-JUDGED,
# NOT-RUN) and the expected and observed values. The gate fails when the multiset differs in any way: a fix, a further
# regression under the same check, another wrong value, or a fix plus a new defect that keeps the count.
#   * a failing or skipped check no row claims fails the gate; the first matching row claims a check;
#   * match keys are an allowlist (harness/ledger.py MATCH_KEYS): never verdict, id or *_prefix; each row names a
#     check, oracle_id, field, part, step or probe. A list means "any of" (exact strings);
#   * the PR that changes the product or the lab re-pins the rows from a live run on its head and posts the run:
#       cd e2e/cbom && python3 -m harness.ledger pin <run dir> --write     (CI cannot see a run)
# Pinned to the live gate run named in the PR that last edited this file (bundle sha256 on that PR).
# Run `cd e2e/cbom && python3 -m harness.gate judge <run>`: report.md lists each row's status and, when it moved, what.

# ---------------------------------------------------------------------------- build identity (CB-03, PR #72)
- row: PRE-build-identity
  gate: [G0, G12]
  match: {check: [build_health, build_header, build_frontend_meta, build_node_label, engine_version_eq_build]}
  issue: "#73"
  owner: CB-03
  why: "dev has no /health build field, X-ZS-Build header, zs-build meta or node build label, and the export's
    zs:engine_version is a constant (main.py:148, common.py:46)"
  expect:
    - {"id": "G0/build_frontend_meta", "expected": "<hex:40>", "observed": "<no zs-build meta> (GET /login 200)"}
    - {"id": "G0/build_header", "expected": "<hex:40>", "observed": "<no header>"}
    - {"id": "G0/build_health", "expected": "<hex:40>", "observed": "<no build field>"}
    - {"id": "G0/build_node_label", "expected": "<hex:40>", "observed": {"ZS_NODE_BUILD": null, "image": "dss-staging/scan-node:stack", "org.opencontainers.image.revision": "<hex:40>"}}
    - {"id": "G12/engine_version_eq_build", "expected": "<hex:12>", "observed": "unknown"}

