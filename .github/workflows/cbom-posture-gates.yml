name: CBOM posture
# Hermetic posture gate. Does not edit cbom-gates.yml or cbom-deliverables.yml.
# No Docker. scope_gate.py and eslint_delta.py are WP14 files and are absent,
# so those two steps are not invoked here.
on:
  push:
    branches: [main, develop, ansh]
    paths:
      - "aibom/src/aibom/cbom/**"
      - "aibom/src/aibom/emit/cyclonedx.py"
      - "aibom/src/aibom/integrations/cbom_devsecshield.py"
      - "aibom/config/crypto-risk-weights.yaml"
      - "aibom/tests/**"
      - "bench/cbom/**"
      - "backend/utilities/pdf/cbom_*"
      - "backend/utilities/dashboard/cbom_team_rollup.py"
      - "backend/routers/cbom_deliverables.py"
      - "backend/tests/**"
      - "frontend/utils/backend_api.ts"
      - "frontend/app/[[]team_id]/cbom/page.tsx"
      - "docs/cbom-posture/**"
      - "docs/cbom-research/**"
      - ".github/workflows/cbom-posture-gates.yml"
  pull_request:
    branches: [main, develop, ansh]
    paths:
      - "aibom/src/aibom/cbom/**"
      - "aibom/src/aibom/emit/cyclonedx.py"
      - "aibom/src/aibom/integrations/cbom_devsecshield.py"
      - "aibom/config/crypto-risk-weights.yaml"
      - "aibom/tests/**"
      - "bench/cbom/**"
      - "backend/utilities/pdf/cbom_*"
      - "backend/utilities/dashboard/cbom_team_rollup.py"
      - "backend/routers/cbom_deliverables.py"
      - "backend/tests/**"
      - "frontend/utils/backend_api.ts"
      - "frontend/app/[[]team_id]/cbom/page.tsx"
      - "docs/cbom-posture/**"
      - "docs/cbom-research/**"
      - ".github/workflows/cbom-posture-gates.yml"
jobs:
  aibom:
    name: CBOM posture engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aibom
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install aibom
        run: uv sync --all-extras --dev || uv sync
      - name: Import graph
        run: uv run python -m pytest tests/test_cbom_posture_wp_graph.py -q
      - name: Ruff and mypy
        run: |
          uv run ruff check src/aibom/cbom src/aibom/emit/cyclonedx.py
          uv run mypy src/aibom/cbom src/aibom/emit/cyclonedx.py
      - name: Posture, CBOM, and crypto tests
        run: uv run python -m pytest tests -k "cbom_posture or cbom or crypto" -q --tb=line
      - name: Full aibom suite
        run: uv run python -m pytest tests -q --tb=line
      - name: Baseline counts
        run: uv run python tests/support/baseline_counts.py
      - name: Representative-repo true-miss gate
        run: bash ../bench/cbom/ci_repos.sh
  backend:
    name: CBOM posture backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: ${{ github.workspace }}
      JWT_SECRET_KEY: test-secret
      JWT_REFRESH_SECRET_KEY: test-refresh
      AWS_ACCESS_KEY_ID: DUMMYDUMMYDUMMY
      AWS_SECRET_ACCESS_KEY: dummydummydummy
      AWS_DEFAULT_REGION: us-east-1
      RABBIT_ADMIN_USERNAME: u
      RABBIT_ADMIN_PASSWORD: p
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install backend
        run: uv sync --frozen
      - name: Ruff on posture backend files
        run: >-
          uv run ruff check --line-length 100 --target-version py310
          utilities/pdf/cbom_posture_common.py
          utilities/pdf/cbom_posture_text.py
          utilities/pdf/cbom_infra_posture_pdf.py
          utilities/pdf/cbom_network_tls_pdf.py
          utilities/pdf/cbom_data_at_rest_pdf.py
          utilities/dashboard/cbom_team_rollup.py
          utilities/pdf/cbom_deliverables.py
          utilities/pdf/cbom_board_report_pdf.py
          utilities/pdf/cbom_methodology_pdf.py
          routers/cbom_deliverables.py
      - name: Posture and deliverable tests
        run: >-
          uv run python -m pytest
          tests/test_cbom_posture_*.py
          tests/test_cbom_deliverable_*.py
          tests/test_cbom_deliverables_*.py
          tests/test_cbom_team_rollup.py
          tests/test_cbom_scan_metadata_contract.py
          tests/test_bom_export.py
          -q --tb=line
      - name: Compile new modules
        run: >-
          uv run python -m compileall -q
          utilities/pdf/cbom_posture_common.py
          utilities/pdf/cbom_posture_text.py
          utilities/pdf/cbom_infra_posture_pdf.py
          utilities/pdf/cbom_network_tls_pdf.py
          utilities/pdf/cbom_data_at_rest_pdf.py
          utilities/dashboard/cbom_team_rollup.py
  frontend:
    name: CBOM posture frontend types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npx tsc --noEmit
