# Workers of the production stack. Credentials come from compose/worker-compose/.env (see .env.example in this
# directory): the images no longer carry a .env, so each worker loads that file as its environment.
services:
  worker:
    container_name: devsecshield-scan-worker
    image: ${ECR_REGISTRY}/scan-worker:${TAG}
    env_file: .env
    environment:
      IS_DOCKER_CONTAINER: "True"
      RABBIT_MONGO_CONNECTION_URL: "${RABBIT_MONGO_CONNECTION_URL:?set RABBIT_MONGO_CONNECTION_URL in compose/worker-compose/.env}"
    command: uv run celery -A scan_worker worker -P threads --loglevel=info -Q scan_worker_queue

  cicd_worker:
    container_name: devsecshield-cicd-worker
    image: ${ECR_REGISTRY}/scan-worker:${TAG}
    env_file: .env
    environment:
      IS_DOCKER_CONTAINER: "True"
      RABBIT_MONGO_CONNECTION_URL: "${RABBIT_MONGO_CONNECTION_URL:?set RABBIT_MONGO_CONNECTION_URL in compose/worker-compose/.env}"
    command: uv run celery -A scan_worker worker -P threads --loglevel=info -Q cicd_worker_queue

  guardrail_worker:
    container_name: devsecshield-guardrail-worker
    image: ${ECR_REGISTRY}/guardrail-worker:${TAG}
    env_file: .env
    environment:
      IS_DOCKER_CONTAINER: "True"
      RABBIT_MONGO_CONNECTION_URL: "${RABBIT_MONGO_CONNECTION_URL:?set RABBIT_MONGO_CONNECTION_URL in compose/worker-compose/.env}"
    command: uv run celery -A guardrail_worker worker -P prefork --concurrency=4 --loglevel=info -Q guardrail_worker_queue

  dast_worker:
    container_name: devsecshield-dast-worker
    image: ${ECR_REGISTRY}/dast-worker:${TAG}
    init: true
    mem_limit: 6g
    memswap_limit: 6g
    pids_limit: 2048
    restart: unless-stopped
    env_file:
      - path: .env.dast.aws
        required: false
      - path: .env
        required: false
    environment:
      IS_DOCKER_CONTAINER: "True"
      DAST_REAP_BROWSERS: "1"
      RABBIT_MONGO_CONNECTION_URL: "${RABBIT_MONGO_CONNECTION_URL:?set RABBIT_MONGO_CONNECTION_URL in compose/worker-compose/.env}"
    command: uv run celery -A dast_worker worker -P threads --concurrency=1 --loglevel=info -Q dast_worker_queue --time-limit=43200 --soft-time-limit=41400

  dast_scheduler:
    container_name: devsecshield-dast-scheduler
    image: ${ECR_REGISTRY}/devsecshield-backend:${TAG}
    env_file:
      - path: .env
        required: false
      - path: ../main/.env
        required: false
      - path: ../.env
        required: false
    environment:
      IS_DOCKER_CONTAINER: "True"
      SKIP_ALEMBIC: "1"
    command: uv run python -m backend.utilities.dast.beat
    restart: unless-stopped
