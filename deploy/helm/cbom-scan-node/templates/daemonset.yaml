{{- if .Values.agent.enabled }}
{{- if and .Values.agent.sysPtrace (not (and .Values.agent.runAsRoot .Values.agent.hostPID)) }}
{{- fail "agent.sysPtrace needs agent.runAsRoot=true (capabilities apply to uid 0 only) and agent.hostPID=true (the processes it reads)" }}
{{- end }}
{{- $uid := ternary 0 10001 .Values.agent.runAsRoot }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "cbom-scan-node.fullname" . }}-agent
  labels:
    {{- include "cbom-scan-node.labels" . | nindent 4 }}
    app.kubernetes.io/component: host-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cbom-scan-node.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: host-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cbom-scan-node.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: host-agent
      annotations:
        # a new pool token restarts the pods, so a pod waiting to enroll (its node was reset or deleted after the
        # old token expired or was revoked) reads it
        checksum/pool-token: {{ printf "%s/%s" (include "cbom-scan-node.agentSecretName" .) .Values.agent.poolToken | sha256sum | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      hostPID: {{ .Values.agent.hostPID }}
      {{- with .Values.agent.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # hostPath volumes are created root-owned and fsGroup does not apply to them: hand the per-node state
        # directory to the agent's user. Only CAP_CHOWN and CAP_FOWNER (chmod a directory root no longer owns, on
        # every later start), nothing else.
        - name: state-owner
          image: {{ include "cbom-scan-node.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "chown {{ $uid }}:{{ $uid }} /state && chmod 0700 /state"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: state
              mountPath: /state
      containers:
        - name: host-agent
          image: {{ include "cbom-scan-node.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "cbom-scan-node.commonEnv" . | nindent 12 }}
            - name: ZS_MODE
              value: agent
            - name: ZS_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ZS_HOST_ROOT
              value: /host
            {{- if .Values.agent.hostPID }}
            - name: ZS_HOST_PROC
              value: /proc
            {{- end }}
            - name: ZS_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cbom-scan-node.agentSecretName" . }}
                  key: pool-token
                  optional: true   # only needed until this pod's node has enrolled
          securityContext:
            runAsUser: {{ $uid }}
            runAsGroup: {{ $uid }}
            runAsNonRoot: {{ not .Values.agent.runAsRoot }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              {{- if .Values.agent.runAsRoot }}
              add: {{ ternary (list "DAC_READ_SEARCH" "SYS_PTRACE") (list "DAC_READ_SEARCH") .Values.agent.sysPtrace | toJson }}
              {{- end }}
          {{- include "cbom-scan-node.readiness" . | nindent 10 }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: true
              {{- if semverCompare ">=1.30-0" .Capabilities.KubeVersion.Version }}
              # submounts too (/proc, /sys, ... of the host) where the kubelet and the runtime support it
              recursiveReadOnly: IfPossible
              {{- end }}
            {{- range .Values.agent.hiddenHostPaths }}
            {{- $dest := printf "/host/%s" (trimPrefix "/" .) | clean }}
            {{- if eq $dest "/host" }}
            {{- fail "agent.hiddenHostPaths lists directories under the host root, not the root itself" }}
            {{- end }}
            - name: hidden
              mountPath: {{ $dest | quote }}
              readOnly: true
            {{- end }}
            - name: state
              mountPath: /var/lib/zs-node
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: host-root
          hostPath:
            path: {{ .Values.agent.hostRoot | quote }}
            type: Directory
        {{- if .Values.agent.hiddenHostPaths }}
        - name: hidden
          emptyDir:
            sizeLimit: 1Mi
        {{- end }}
        - name: state
          hostPath:
            path: {{ include "cbom-scan-node.agentStatePath" . | quote }}
            type: DirectoryOrCreate
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
