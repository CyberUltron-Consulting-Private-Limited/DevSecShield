# DevSecShield Chola production (deploy/chola-prod/README.md). One EC2 instance (m7i.2xlarge: 8 vCPU, 32 GB) behind
# the ALB devsec-chola-prod-alb, which ends TLS and forwards plain HTTP to nginx on port 80 only.
#
#   scripts/deploy/chola-prod.sh deploy --sha <commit>     (from the owner's machine; never run compose by hand there)
#
# On the instance the files live in /opt/devsecshield-chola/deploy/chola-prod/ next to four env files that the kit
# renders from AWS Secrets Manager with the instance role (mode 600, owner ubuntu, never in git), one per reader:
#   .env               Compose interpolation only (images, hosts, the datastore containers' own credentials);
#                      no application container gets it
#   backend.env        backend-image services: database, queue, S3/Bedrock keys, JWT, encryption key, mail, CBOM
#   scan-worker.env    scan-worker, cicd-worker: queue, results store, S3/Bedrock keys, Qdrant, model
#   dast-worker.env    dast-worker: queue, results store, Bedrock keys
#
# Exposure: only nginx publishes a port (80). frontend:3000 and backend:8080 sit on the `edge` network; postgres,
# mongo, rabbitmq and qdrant sit only on `data`, an internal network with no route out of the host. Every named volume
# is under /var/lib/docker/volumes, which is the 200 GB data volume (vol-02a57fae6510bb790) that the pre-deployment
# AWS Backup job snapshots. Images are pulled from ECR (application) or loaded from the release archive
# (infrastructure: the instance cannot reach Docker Hub), so every service has pull_policy: never.
# DSS_DEV_MODE and LOCAL_DEV_VERIFICATION_* are never set here; remote.sh refuses to start if they are.
#
# Memory limits add up to about 29 GB, leaving the rest to the OS and page cache.

name: dss-chola

x-backend-image: &backend-image ${DSS_IMAGE_PREFIX:?set DSS_IMAGE_PREFIX}/devsecshield-backend:${DSS_TAG:?set DSS_TAG}
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
x-backend-env-files: &backend-env-files
  - path: backend.env
# remote.sh sets DSS_FILES_HASH to the sha256 of nginx/ and compose/aibom-config-overlay/. They are bind mounts, which
# Compose does not compare: the label makes a changed file recreate the containers that read it.
x-files-label: &files-label
  com.zeroshield.dss.files-hash: ${DSS_FILES_HASH:-unset}
x-backend-service: &backend-service
  image: *backend-image
  pull_policy: never
  labels: *files-label
  env_file: *backend-env-files
  logging: *logging
  networks: [data, egress]
  volumes:
    # rbi_posture / cert-in rollups resolve at /aibom/config; the backend image does not contain them.
    - ../../compose/aibom-config-overlay:/aibom/config:ro

services:
  postgres:
    image: postgres:15-alpine
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${PG_USER:?set PG_USER}
      POSTGRES_PASSWORD: ${PG_USER_PASS:?set PG_USER_PASS}
      POSTGRES_DB: ${PG_DB:?set PG_DB}
    # 4 API workers + cloud worker + scheduler + one-shots, each with a SQLAlchemy pool: 200 leaves headroom.
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=1GB", "-c", "effective_cache_size=3GB",
              "-c", "maintenance_work_mem=256MB", "-c", "wal_compression=on", "-c", "password_encryption=scram-sha-256"]
    shm_size: 512m
    mem_limit: 4g
    cpus: 2
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      # -h 127.0.0.1: TCP, so it passes only once the real server (not the init-time socket server) is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mongo:
    image: mongo:8.0.6
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?set MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set MONGO_INITDB_ROOT_PASSWORD}
    command: ["mongod", "--wiredTigerCacheSizeGB", "1"]
    mem_limit: 2500m
    cpus: 1.5
    volumes:
      - mongodata:/data/db
      - mongoconfig:/data/configdb
    networks: [data]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--norc", "--eval", "quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_ADMIN_USERNAME:?set RABBIT_ADMIN_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_ADMIN_PASSWORD:?set RABBIT_ADMIN_PASSWORD}
    mem_limit: 1g
    cpus: 1
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    networks: [data]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s

  # Vector store of the SAST / IaC / SCA AI analysis (scan workers: QDRANT_HOST/PORT/API_KEY in .env). Not part of
  # deploy/staging; the workers fail those scans without it ("QDRANT_API_KEY not found").
  qdrant:
    image: qdrant/qdrant:v1.13.5
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY}
      QDRANT__TELEMETRY_DISABLED: "true"
    mem_limit: 1500m
    cpus: 1
    volumes:
      - qdrant:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    networks: [data]
    healthcheck:
      # The image has bash but neither curl nor wget; /readyz needs no API key.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  # One-shot: alembic upgrade head (the image entrypoint; migrations/env.py holds a Postgres advisory lock) and the
  # DAST log data migration, then exits 0. Everything that uses the database waits for it. An older image fails here on
  # a database a newer release migrated: go back with `chola-prod.sh rollback` (README "Rollback").
  migrate:
    <<: *backend-service
    restart: "no"
    networks: [data]
    environment:
      SKIP_ALEMBIC: "0"
      DSS_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    command: ["true"]

  backend:
    <<: *backend-service
    restart: unless-stopped
    environment:
      SKIP_ALEMBIC: "1"
      # gunicorn/uvicorn trust X-Forwarded-For/-Proto only from nginx's fixed address on `edge`.
      FORWARDED_ALLOW_IPS: ${DSS_PROXY_IP:-172.30.251.10}
      DSS_EXPOSE_BUILD: "0"
      DSS_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    command: ["uv", "run", "gunicorn", "main:app", "-k", "uvicorn.workers.UvicornWorker",
              "--workers", "${BACKEND_WORKERS:-4}", "--bind", "0.0.0.0:8080", "--timeout", "300",
              "--graceful-timeout", "30", "--keep-alive", "5"]
    mem_limit: 4g
    cpus: 3
    volumes:
      - backend-data:/backend/data
      - ../../compose/aibom-config-overlay:/aibom/config:ro
    networks: [data, edge]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 60s

  # CBOM sources (AWS accounts with the collector keys, IdP metadata), fleet threads, integration dispatcher.
  cbom-cloud-worker:
    <<: *backend-service
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      SKIP_ALEMBIC: "1"
      DSS_ENV: production
      CBOM_CLOUD_WORKERS: ${CBOM_CLOUD_WORKERS:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uv", "run", "python", "-m", "backend.workers.cbom_cloud_worker"]
    mem_limit: 2g
    cpus: 1

  dast-scheduler:
    <<: *backend-service
    restart: unless-stopped
    environment:
      SKIP_ALEMBIC: "1"
      DSS_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    command: ["uv", "run", "python", "-m", "backend.utilities.dast.beat"]
    mem_limit: 1g
    cpus: 0.5

  scan-worker:
    image: ${DSS_IMAGE_PREFIX}/scan-worker:${DSS_TAG}
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    env_file: [scan-worker.env]
    environment:
      IS_DOCKER_CONTAINER: "True"
      GRYPE_DB_CACHE_DIR: /var/cache/grype
    volumes:
      - grype-db:/var/cache/grype
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command: ["uv", "run", "celery", "-A", "scan_worker", "worker", "-P", "threads", "--loglevel=info", "-Q", "scan_worker_queue"]
    mem_limit: 5g
    cpus: 3
    networks: [data, egress]

  cicd-worker:
    image: ${DSS_IMAGE_PREFIX}/scan-worker:${DSS_TAG}
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    env_file: [scan-worker.env]
    environment:
      IS_DOCKER_CONTAINER: "True"
      GRYPE_DB_CACHE_DIR: /var/cache/grype
    volumes:
      - grype-db:/var/cache/grype
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command: ["uv", "run", "celery", "-A", "scan_worker", "worker", "-P", "threads", "--loglevel=info", "-Q", "cicd_worker_queue"]
    mem_limit: 3g
    cpus: 2
    networks: [data, egress]

  dast-worker:
    image: ${DSS_IMAGE_PREFIX}/dast-worker:${DSS_TAG}
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    init: true
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 2
    pids_limit: 2048
    env_file: [dast-worker.env]
    environment:
      IS_DOCKER_CONTAINER: "True"
      DAST_REAP_BROWSERS: "1"
      # The image does not set these (the backend and scan-worker images do): `uv run` must never try to resolve or
      # download packages at start; the instance cannot reach PyPI.
      UV_NO_SYNC: "1"
      UV_OFFLINE: "1"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    command: ["uv", "run", "celery", "-A", "dast_worker", "worker", "-P", "threads", "--concurrency=1", "--loglevel=info",
              "-Q", "dast_worker_queue", "--time-limit=43200", "--soft-time-limit=41400"]
    networks: [data, egress]

  # NEXT_PUBLIC_BACKEND_URL (https://chola-api.zeroshield.ai) is baked in at build time (chola-prod.sh images builds
  # this image; the GHCR dev/staging frontends carry http://localhost:8000). Nothing secret here.
  frontend:
    image: ${DSS_IMAGE_PREFIX}/devsecshield-frontend:${DSS_TAG}
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    cpus: 1
    networks: [edge]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/login', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    pull_policy: never
    labels: *files-label
    restart: unless-stopped
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      FRONTEND_HOST: ${FRONTEND_HOST:?set FRONTEND_HOST}
      API_HOST: ${API_HOST:?set API_HOST}
      # The ALB subnets: the only senders whose X-Forwarded-For / X-Forwarded-Proto are believed.
      DSS_REAL_IP_FROM: ${DSS_REAL_IP_FROM:?set DSS_REAL_IP_FROM to the ALB subnets}
    # The ALB forwards to port 80. DSS_HTTP_PORT exists only for a local smoke test of this file on a machine whose
    # port 80 is taken; kit.py render-env never writes it, so production always publishes 80.
    ports:
      - "${DSS_HTTP_PORT:-80}:80"
    mem_limit: 256m
    cpus: 1
    volumes:
      - ./nginx/40-chola-site.sh:/docker-entrypoint.d/40-chola-site.sh:ro
      - ./nginx/site.conf.template:/etc/dss-nginx/site.conf.template:ro
    networks:
      edge:
        ipv4_address: ${DSS_PROXY_IP:-172.30.251.10}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 5s

volumes:
  pgdata:
  mongodata:
  mongoconfig:
  rabbitmq:
  qdrant:
  qdrant-snapshots:
  backend-data:
  # Grype's vulnerability database (~1 GB), shared by scan-worker and cicd-worker.
  grype-db:

networks:
  # Databases, queue and vector store: no route out of the host, reachable only by the application containers.
  data:
    internal: true
  # Outbound for the backend-image services and workers: S3, Bedrock, STS, SMTP, GitHub/GitLab/Bitbucket clones,
  # the Grype DB (the instance's own egress rules limit where this can go).
  egress:
  # nginx <-> frontend / backend; nginx has a fixed address the backend trusts for X-Forwarded-*.
  edge:
    ipam:
      config:
        - subnet: ${DSS_EDGE_SUBNET:-172.30.251.0/24}
