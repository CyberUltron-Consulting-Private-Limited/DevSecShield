# Weekly full security scan, report mode: every scanner over the whole tree (SARIF in the artifacts, counts in the run
# summary). New findings are blocked earlier, by the diff-mode scan of every pull request and push. No secret scanning
# (removed from CI on 2026-11-12, owner decision).
# GitHub runs schedules only from the default branch, so this starts firing once it is promoted to `main`; until
# then run it by hand (Actions -> Security (scheduled) -> Run workflow).
name: Security (scheduled)

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scheduled
  cancel-in-progress: false

jobs:
  security:
    name: security
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-security.yml
    with:
      mode: full
      exclude-regex: >-
        ^(aibom/tests/fixtures|scan_node/tests/fixtures|backend/tests/fixtures|e2e/fixtures|bench/repos|aibom/bench/repos|aibom/examples)/|(^|/)(node_modules|\.venv|venv|\.next|dist)/
      semgrep-exclude: >-
        aibom/tests/fixtures scan_node/tests/fixtures backend/tests/fixtures e2e/fixtures bench/repos aibom/bench/repos
        aibom/examples node_modules .venv
      trivy-skip-dirs: >-
        aibom/tests/fixtures,scan_node/tests/fixtures,backend/tests/fixtures,e2e/fixtures,bench/repos,aibom/bench/repos,aibom/examples,**/node_modules,**/.venv
      helm-charts: >-
        deploy/helm/cbom-scan-node --set apiUrl=https://ci.invalid --set registrationToken=ci-placeholder
        --set agent.enabled=true --set agent.poolToken=ci-placeholder
