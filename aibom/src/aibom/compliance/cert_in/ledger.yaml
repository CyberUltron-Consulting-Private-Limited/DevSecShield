guideline:
  title: CERT-In Technical Guidelines on SBOM, QBOM & CBOM, AIBOM and HBOM
  version: '2.0'
  dated: '2025-07-09'
  disclaimer: Advisory alignment to CERT-In Technical Guidelines Version 2.0 dated 09.07.2025. Does not
    constitute CERT-In certification.
frameworks:
  cert_in_cbom:
    label: CERT-In CBOM (Guidelines v2.0)
    lane: cbom
  cert_in_aibom:
    label: CERT-In AIBOM (Guidelines v2.0)
    lane: aibom
  cert_in_sbom:
    label: CERT-In SBOM (Guidelines v2.0)
    lane: sbom
scope_exclusions:
  qbom_table_8: Table 8 QBOM minimum elements are out of product scope (no QBOM scan type).
  hbom_table_11: Table 11 HBOM minimum elements are deferred.
