# Installed as /etc/systemd/system/docker.service.d/devsec-chola-imds-block.conf by `remote.sh imds-block`: the IMDS
# block is in DOCKER-USER before dockerd starts (Docker keeps the chain's rules). "-": a failure here never keeps Docker
# down; devsec-chola-imds-block.service runs it again after Docker, and the kit's preflight checks the rule.
[Service]
ExecStartPre=-/usr/local/sbin/devsec-chola-imds-block
