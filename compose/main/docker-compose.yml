services:

  devsecshield-backend:
    container_name: devsecshield-backend
    image: ${ECR_REGISTRY}/devsecshield-backend:${TAG}
    ports:
      - 9000:8080 
    volumes:
      - devsecshield-backend-data:/backend/data

  devsecshield-frontend:
    container_name: devsecshield-frontend
    image: ${ECR_REGISTRY}/devsecshield-frontend:${TAG}
    ports:
      - 4000:3000 # changed from 3002 to 4000 to avoid conflict with other services


volumes:
  devsecshield-backend-data:
    driver: local
