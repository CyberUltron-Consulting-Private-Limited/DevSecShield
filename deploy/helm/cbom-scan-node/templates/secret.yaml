{{- $node := and .Values.deployment.enabled (not .Values.existingSecret) .Values.registrationToken -}}
{{- $pool := and .Values.agent.enabled (not .Values.agent.existingSecret) .Values.agent.poolToken -}}
{{- if or $node $pool }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-tokens" (include "cbom-scan-node.fullname" .) }}
  labels:
    {{- include "cbom-scan-node.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $node }}
  registration-token: {{ .Values.registrationToken | quote }}
  {{- end }}
  {{- if $pool }}
  pool-token: {{ .Values.agent.poolToken | quote }}
  {{- end }}
{{- end }}
