# strongSwan ipsec.conf — a deliberately legacy IPsec gateway.
# IKEv1 is deprecated (RFC 9395); the transform set uses 3DES + MD5 + modp1024.
config setup
    charondebug="ike 2, knl 2"

conn legacy-vpn
    keyexchange=ikev1
    ike=3des-md5-modp1024
    esp=3des-md5
    authby=secret
    auto=start
    # note: below the modern floor — kept for the fixture on purpose
