services:
  devsecshield-mongodb-atlas:
    image: mongodb/mongodb-atlas-local
    container_name: devsecshield-mongodb-atlas
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=${MONGO_ATLAS_USERNAME}
      - MONGODB_INITDB_ROOT_PASSWORD=${MONGO_ATLAS_PASSWORD}
    ports:
      - 27018:27017
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - db:/data/db
      - configdb:/data/configdb
      - mongot:/data/mongot
volumes:
  db:
    driver: local
  configdb:
    driver: local
  mongot:
    driver: local