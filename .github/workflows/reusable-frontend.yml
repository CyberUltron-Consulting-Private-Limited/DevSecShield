# Reusable frontend job for a Node / TypeScript / Next.js project.
#
#   jobs:
#     frontend:
#       uses: AnshSinghal-CyberUltron/devsecshield/.github/workflows/reusable-frontend.yml@<ref>
#       with:
#         working-directory: frontend
#
# Steps: npm ci -> tsc --noEmit -> eslint -> every *.test.ts run with tsx -> next build. Once the install succeeds,
# each check runs even when an earlier one failed, so one run shows every problem.
#
# ESLint modes: `blocking` (any error fails), `diff` (default; on pull requests the base commit is linted too and
# only errors the PR adds fail; on other events errors are reported), or `off`.
name: reusable / frontend

on:
  workflow_call:
    inputs:
      suite-name:
        type: string
        default: frontend
      working-directory:
        type: string
        default: frontend
      node-version:
        type: string
        default: "20"
      install-command:
        type: string
        default: npm ci --no-audit --no-fund
      typecheck-command:
        description: Empty skips the type check.
        type: string
        default: npx tsc --noEmit
      eslint-mode:
        description: >-
          diff (pull requests fail only on errors the PR adds; a base commit that cannot be checked out fails, and
          if ESLint fails on the base, every error in a file the PR adds or modifies counts as new; other events
          report), blocking (any error fails) or off. ESLint exiting > 1 always fails.
        type: string
        default: diff
      eslint-args:
        description: Arguments after `npx eslint` (files / directories / flags).
        type: string
        default: "."
      test-pattern:
        description: File name pattern for the tests (find -name), searched outside node_modules and .next.
        type: string
        default: "*.test.ts"
      test-runner:
        description: Command each test file is passed to.
        type: string
        default: npx --yes tsx@4.23.15
      build-command:
        description: Empty skips the build.
        type: string
        default: npx next build
      build-env:
        description: Non-secret environment for the build, one KEY=VALUE per line.
        type: string
        default: |
          NEXT_TELEMETRY_DISABLED=1
          NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
      timeout-minutes:
        type: number
        default: 30
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  frontend:
    name: ${{ inputs.suite-name }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node ${{ inputs.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Next.js build cache
        if: inputs.build-command != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.working-directory }}/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}-

      # Before `npm ci` runs any PR code (install scripts): fetch the base commit for the ESLint diff. The token is
      # used for this one fetch and is not in the environment of any later step.
      - name: Base commit for the ESLint diff
        id: base
        if: inputs.eslint-mode == 'diff' && github.event.pull_request.base.sha != ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FETCH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          set +e -uo pipefail # the runner starts bash with -e; exit codes are checked explicitly
          auth=$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          # Also the files the PR adds or modifies, and its renames, for the comparison.
          if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$BASE_SHA" \
             && git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA" > /dev/null \
             && git -c core.quotePath=false diff --no-ext-diff -M --name-only --diff-filter=AMR "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed.txt" \
             && git -c core.quotePath=false diff --no-ext-diff -M --name-status --diff-filter=R "$BASE_SHA" HEAD > "$RUNNER_TEMP/renames.tsv" \
             && git -c core.quotePath=false diff --no-ext-diff -M -U0 "$BASE_SHA" HEAD > "$RUNNER_TEMP/diff.txt"; then
            echo "dir=$RUNNER_TEMP/base" >> "$GITHUB_OUTPUT"
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            # Not fatal here (tests and build still run); the ESLint step fails, because without the base it cannot gate.
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "::error::could not check out the base commit $BASE_SHA for the ESLint diff"
          fi

      - name: Install
        id: install
        env:
          CMD: ${{ inputs.install-command }}
        # The command comes from the calling workflow; it is passed through env, not pasted into the script.
        run: bash -eo pipefail -c "$CMD"

      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.typecheck-command != '' }}
        env:
          CMD: ${{ inputs.typecheck-command }}
        # The command comes from the calling workflow; it is passed through env, not pasted into the script.
        run: bash -eo pipefail -c "$CMD"

      - name: ESLint (${{ inputs.eslint-mode }})
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.eslint-mode != 'off' }}
        env:
          MODE: ${{ inputs.eslint-mode }}
          ESLINT_ARGS: ${{ inputs.eslint-args }}
          WD: ${{ inputs.working-directory }}
          IS_PR: ${{ github.event.pull_request.number != '' }}
          BASE_STATUS: ${{ steps.base.outputs.status }}
          BASE_DIR: ${{ steps.base.outputs.dir }}
        run: |
          set +e -uo pipefail # the runner starts bash with -e; exit codes are checked explicitly
          out="$RUNNER_TEMP/eslint"; mkdir -p "$out"
          if [ "$MODE" = blocking ]; then
            # shellcheck disable=SC2086 # ESLINT_ARGS is a word list
            npx eslint $ESLINT_ARGS
            exit $?
          fi
          # shellcheck disable=SC2086
          npx eslint -f json -o "$out/head.json" $ESLINT_ARGS
          head_rc=$?
          base_rc=none
          if [ "$IS_PR" = true ] && [ "$BASE_STATUS" = ok ] && [ -d "$BASE_DIR/$WD" ]; then
            # The base commit's files, linted with this run's dependencies and the base's own config.
            ln -s "$PWD/node_modules" "$BASE_DIR/$WD/node_modules"
            # shellcheck disable=SC2086
            (cd "$BASE_DIR/$WD" && npx eslint -f json -o "$out/base.json" $ESLINT_ARGS)
            base_rc=$?
          fi
          # Every decision is in this script, so .github/tests/test_diff_gates.py tests exactly what CI runs.
          python3 - "$out" "$head_rc" "$base_rc" <<'PY'
          import collections, json, os, re, sys
          out, head_rc, base_rc = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          env = os.environ
          wd, tmp = env["WD"], env.get("RUNNER_TEMP", "/tmp")
          head_root, base_dir = os.getcwd(), env.get("BASE_DIR", "")
          base_root = os.path.normpath(os.path.join(base_dir, wd)) if base_dir else ""
          pre = "" if wd in (".", "./") else wd.strip("/") + "/"
          ROOTS = [r.rstrip("/") + "/" for r in (head_root, base_root) if r]

          def norm(msg):
              # First line only: React Compiler rules (react-hooks/*) append a code frame with the absolute path and
              # line numbers, which differ between the head and base checkouts. Also drop roots and "line 123".
              msg = (msg or "").strip().splitlines()[:1] or [""]
              msg = msg[0]
              for r in ROOTS:
                  msg = msg.replace(r, "")
              return " ".join(re.sub(r"\bline \d+", "line N", msg).split())

          def load(path, root):
              """(errors, first line) per (file, rule, message); None when the report is missing or unreadable."""
              try:
                  report = json.load(open(path, encoding="utf-8"))
              except (OSError, ValueError):
                  return None
              c, where = collections.Counter(), {}
              for f in report:
                  rel = os.path.relpath(f["filePath"], root)
                  for m in f.get("messages", []):
                      if m.get("severity") != 2:  # errors only; warnings never block
                          continue
                      k = (rel, m.get("ruleId") or "parse", norm(m.get("message")))
                      c[k] += 1
                      where.setdefault(k, []).append((m.get("line", 1), k[2]))
              return c, where

          def added_lines():
              """file -> line numbers this change added, from `git diff -U0` (the base step); {} when absent."""
              out, cur = {}, None
              path = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "diff.txt")
              if not os.path.exists(path):
                  return out
              for line in open(path, encoding="utf-8", errors="replace"):
                  if line.startswith("+++ "):
                      p = line[4:].rstrip("\n")
                      cur = p[2:] if p.startswith("b/") else None
                  elif line.startswith("@@") and cur:
                      m = re.match(r"@@ -\S+ \+(\d+)(?:,(\d+))? @@", line)
                      if m:
                          start, count = int(m[1]), int(m[2] if m[2] is not None else 1)
                          out.setdefault(cur, set()).update(range(start, start + count))
              return out

          def placed(occurrences, file, n):
              """Up to n of a key's head occurrences, those on added lines first (several findings share a key)."""
              on_added = [o for o in occurrences if int(o[0]) in ADDED_LINES.get(file, ())]
              return (on_added or occurrences)[:n]

          def repo_paths(name):
              path = os.path.join(tmp, name)
              return [l.rstrip("\n").split("\t") for l in open(path, encoding="utf-8")] if os.path.exists(path) else []

          ADDED_LINES = {k[len(pre):]: v for k, v in added_lines().items() if k.startswith(pre)}
          problems, mode, note = [], "report", "report only: not a pull request"
          head = load(os.path.join(out, "head.json"), head_root)
          h, where = head or (collections.Counter(), {})
          if head_rc not in (0, 1) or head is None:
              problems.append(f"eslint did not run on this change (exit {head_rc}); see the log above")
          elif head_rc == 1 and not h:
              problems.append("eslint exited 1 but its report holds no error")
          b = collections.Counter()
          if not problems and env.get("IS_PR") == "true":
              if env.get("BASE_STATUS") != "ok" or not base_dir:
                  problems.append("the base commit could not be checked out, so new errors cannot be told from existing ones (see the step 'Base commit for the ESLint diff')")
              elif not os.path.isdir(base_root):
                  mode, note = "diff", "the project is new in this change"
              else:
                  base = load(os.path.join(out, "base.json"), base_root) if base_rc in ("0", "1") else None
                  if base is None:
                      # e.g. an ESLint, plugin or config upgrade the base's config cannot load
                      mode = "changed-files"
                      note = f"ESLint failed on the base commit (exit {base_rc}), so every error in a file this change adds or modifies counts as new"
                      print(f"::warning title=ESLint::{note}")
                  else:
                      renamed = {r[1][len(pre):]: r[2][len(pre):] for r in repo_paths("renames.tsv")
                                 if len(r) == 3 and r[0].startswith("R") and r[1].startswith(pre) and r[2].startswith(pre)}
                      for (rel, rule, msg), n in base[0].items():
                          b[(renamed.get(rel, rel), rule, msg)] += n
                      mode, note = "diff", ""
          if mode == "diff":
              new = h - b
          elif mode == "changed-files":
              changed = {r[0][len(pre):] for r in repo_paths("changed.txt") if r and r[0].startswith(pre)}
              new = collections.Counter({k: n for k, n in h.items() if k[0] in changed})
          else:
              new = collections.Counter()
          for p in problems:
              print(f"::error title=ESLint::{p}")
          for (rel, rule, msg), n in list(new.items())[:50]:
              shown = placed(where[(rel, rule, msg)], rel, n)
              for line, _ in shown:
                  print(f"::error file={pre}{rel},line={line}::eslint {rule}: {msg}" + (f" (x{n})" if len(shown) < n and n > 1 else ""))
          total, n_new, gated = sum(h.values()), sum(new.values()), mode != "report"
          result = "FAIL (eslint did not run)" if problems else ("FAIL" if n_new else "pass") if gated else "report only"
          with open(env["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write("### ESLint\n\n| errors now | on base | new in this change | result |\n|---:|---:|---:|---|\n")
              s.write(f"| {total} | {sum(b.values()) if mode == 'diff' else 'n/a'} | {n_new if gated else 'n/a'} | {result} |\n\n")
              if note:
                  s.write(f"{note}.\n\n")
          print(f"eslint: {total} error(s); new: {n_new if gated else 'n/a'}" + (f" ({note})" if note else "") + (" -> did not run" if problems else ""))
          sys.exit(1 if problems or n_new else 0)
          PY

      - name: Unit tests (${{ inputs.test-pattern }})
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          PATTERN: ${{ inputs.test-pattern }}
          RUNNER: ${{ inputs.test-runner }}
        run: |
          set +e -uo pipefail # the runner starts bash with -e; exit codes are checked explicitly
          mapfile -t tests < <(find . -name "$PATTERN" -not -path './node_modules/*' -not -path './.next/*' | sort)
          if [ "${#tests[@]}" -eq 0 ]; then echo "::notice::no $PATTERN files"; exit 0; fi
          failed=()
          for t in "${tests[@]}"; do
            echo "::group::$t"
            # shellcheck disable=SC2086 # RUNNER is a command line
            if ! $RUNNER "$t"; then failed+=("$t"); echo "::error file=${t#./}::test file failed: $t"; fi
            echo "::endgroup::"
          done
          {
            echo "### Unit tests"
            echo
            echo "${#tests[@]} file(s), ${#failed[@]} failed."
            for f in "${failed[@]}"; do echo "- \`$f\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${#failed[@]}" -eq 0 ]

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.build-command != '' }}
        env:
          BUILD_ENV: ${{ inputs.build-env }}
          BUILD: ${{ inputs.build-command }}
        run: |
          set -euo pipefail
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "${line//[[:space:]]/}" ] && continue
            [[ "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]] || { echo "::error::build-env line is not KEY=VALUE"; exit 1; }
            export "${line?}"
          done <<< "$BUILD_ENV"
          bash -c "$BUILD"
