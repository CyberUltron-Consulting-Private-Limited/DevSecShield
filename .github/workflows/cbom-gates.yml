name: CBOM Regression Gates

# Locks the CBOM (cryptography BOM) half of the pipeline end-to-end, mirroring
# aibom-gates.yml. Blocks merges on the regressions we never want back:
#   (a) crypto detection (Python/JVM/Go/native-API AST algorithm scan, certificate
#       depth, protocol + policy config, related-material/misuse weakness, manifest
#       libraries, OID enrichment, security-strength + PQC grading) dropping below
#       the synthetic ground-truth and the benchmark true-miss gate,
#   (b) any CBOM results-page chart being able to go EMPTY (the chart-data
#       contract) or the normalizer flattening the carried-through distributions,
#   (c) compliance tri-state collapsing OUT_OF_SCOPE / NOT_BOM_EVIDENCEABLE into
#       FAIL across the expanded framework set (PCI-DSS 4 / FIPS 140-3 / BSI /
#       CNSA 2.0 / NIST 1800-38C),
#   (d) the hand-built CycloneDX 1.6 crypto-asset BOM + dependency graph drifting
#       from its golden, and
#   (e) the CBOM results page (CbomResults.tsx + CbomCryptoCharts.tsx) failing to
#       type-check against the scan-metadata contract.
#
# Gate A runs the WHOLE committed CBOM+crypto test suite (-k "cbom or crypto") so a
# NEW capability scanner can never silently escape the regression lock the way it
# could when the gate enumerated a fixed file list. The benchmark oracle is the
# FROZEN cbomkit-theia + cdxgen snapshots committed under bench/cbom/ci_baseline/ —
# no docker, no network, only OUR offline/deterministic crypto scanner is exercised
# per-PR. The full LIVE benchmark vs IBM cbomkit-theia runs on cbom-nightly.yml.

on:
  push:
    branches: [main, develop, module_1, ansh, feat/cbom-best-of-breed]
    paths:
      - "aibom/src/aibom/cbom/**"
      - "aibom/src/aibom/integrations/cbom_devsecshield.py"
      - "aibom/tests/test_cbom_*.py"
      - "aibom/tests/test_crypto_fixture_manifest.py"
      - "aibom/tests/fixtures/synthetic-crypto-*/**"
      - "bench/cbom/**"
      - "frontend/components/CbomResults.tsx"
      - "frontend/components/cbom/**"
      - "RabbitMQ/worker/scan_worker.py"
      - ".github/workflows/cbom-gates.yml"
  pull_request:
    branches: [main, develop, module_1, ansh, feat/cbom-best-of-breed]
    paths:
      - "aibom/src/aibom/cbom/**"
      - "aibom/src/aibom/integrations/cbom_devsecshield.py"
      - "aibom/tests/test_cbom_*.py"
      - "aibom/tests/test_crypto_fixture_manifest.py"
      - "aibom/tests/fixtures/synthetic-crypto-*/**"
      - "bench/cbom/**"
      - "frontend/components/CbomResults.tsx"
      - "frontend/components/cbom/**"
      - "RabbitMQ/worker/scan_worker.py"
      - ".github/workflows/cbom-gates.yml"

jobs:
  cbom-gates:
    name: CBOM regression gates (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aibom
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install aibom (+ test deps)
        run: uv sync --all-extras --dev || uv sync

      # Gate (a): the WHOLE committed CBOM + crypto test suite. This is the
      # comprehensive regression lock — every clean-room capability scanner
      # (algorithm/JVM+Go/native-API AST detection, certificate depth, protocol +
      # crypto-policy config, related-material misuse, manifest libraries, OID +
      # security-strength enrichment, PQC readiness), every emit/graph golden, the
      # tri-state compliance frameworks, the scorer and the DevSecShield adapter
      # e2e are exercised here. Selecting by the -k expression (not a fixed file
      # list) means a NEW scanner's tests auto-join the lock and can never silently
      # regress. A single failure fails the build.
      - name: Gate A — full committed CBOM + crypto suite (no capability escapes the lock)
        run: >-
          AIBOM_LLM_OFFLINE=1 uv run --with pytest python -m pytest
          tests/ -k "cbom or crypto" -v

      # Gate (b): benchmark true-miss gate (hermetic) + crypto recall. Ours vs the
      # FROZEN cbomkit-theia + cdxgen oracles on the synthetic fixture must have
      # ZERO true-positive misses (FP-triaged) AND our-unique > 0. Named separately
      # from Gate A for emphasis — this is the differential-parity invariant.
      - name: Gate B — benchmark true-miss + crypto recall (hermetic / synthetic)
        run: AIBOM_LLM_OFFLINE=1 uv run --with pytest python -m pytest tests/test_cbom_benchmark_gate.py -v

      # Gate (c): lint + types on the CBOM lane. ruff and mypy must stay clean on
      # every shipped crypto scanner / compliance / emit module (the product ships
      # NO OSS BOM tool + NO runtime LLM — a type/lint regression here often flags a
      # broken clean-room boundary).
      - name: Gate C — ruff + mypy (CBOM lane)
        run: |
          uv run ruff check src/aibom/cbom/ src/aibom/integrations/cbom_devsecshield.py
          uv run mypy src/aibom/cbom/

      # Gate (d): the same true-miss gate on 2 representative REAL repos (pyjwt,
      # pyopenssl) cloned at HEAD, diffed vs the frozen cbomkit-theia + cdxgen
      # snapshots. The full multi-repo LIVE benchmark runs on cbom-nightly.yml.
      - name: Gate D — true-miss gate on representative repos
        run: bash ../bench/cbom/ci_repos.sh

  cbom-frontend-gate:
    name: CBOM regression gates (frontend type contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      # Gate (e): the CBOM results page + charts must type-check against the
      # scan-metadata contract (cbom_distributions / cbom_compliance / cbom_scores /
      # cbom_graph). A drift between the backend run-object shape and the
      # CbomCryptoCharts prop types fails the build before it can render an empty or
      # broken CBOM results page.
      - name: Gate E — CBOM results-page type contract (tsc --noEmit)
        run: npx tsc --noEmit
