name: CBOM Team Deliverables
# Locks the team-wide CBOM deliverables lane (six PDF renderers, the
# cbom_team_rollup aggregator, the cbom_deliverables router, and the CBOM page
# dropdown). Hermetic: no docker, no network, no LLM. Mirrors cbom-gates.yml and
# deliberately leaves pdf-smoke.yml untouched.
on:
  push:
    branches: [main, develop, module_1, ansh, feat/cbom-team-deliverables]
    paths:
      - "backend/utilities/pdf/cbom_*"
      - "backend/utilities/dashboard/cbom_team_rollup.py"
      - "backend/routers/cbom_deliverables.py"
      - "backend/tests/test_cbom_*.py"
      - "backend/tests/fixtures/cbom_*"
      - "frontend/app/[[]team_id]/cbom/**"
      - "frontend/utils/backend_api.ts"
      - "frontend/components/cbom/**"
      - ".github/workflows/cbom-deliverables.yml"
  pull_request:
    branches: [main, develop, module_1, ansh, feat/cbom-team-deliverables]
    paths:
      - "backend/utilities/pdf/cbom_*"
      - "backend/utilities/dashboard/cbom_team_rollup.py"
      - "backend/routers/cbom_deliverables.py"
      - "backend/tests/test_cbom_*.py"
      - "backend/tests/fixtures/cbom_*"
      - "frontend/app/[[]team_id]/cbom/**"
      - "frontend/utils/backend_api.ts"
      - "frontend/components/cbom/**"
      - ".github/workflows/cbom-deliverables.yml"
jobs:
  cbom-deliverables-backend:
    name: CBOM deliverables (backend, hermetic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: ${{ github.workspace }}
      JWT_SECRET_KEY: test-secret
      JWT_REFRESH_SECRET_KEY: test-refresh
      AWS_ACCESS_KEY_ID: DUMMYDUMMYDUMMY
      AWS_SECRET_ACCESS_KEY: dummydummydummy
      AWS_DEFAULT_REGION: us-east-1
      RABBIT_ADMIN_USERNAME: u
      RABBIT_ADMIN_PASSWORD: p
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install backend (frozen lock)
        run: uv sync --frozen
      # The new lane: roll-up aggregator, six renderers, router, contract and the
      # no-LLM / no-network guard (sockets are blocked at runtime).
      - name: New deliverable tests (rollup, renderers, route, contract, no-LLM)
        run: >-
          uv run --with pytest python -m pytest
          tests/test_cbom_team_rollup.py
          tests/test_cbom_deliverable_*.py
          tests/test_cbom_deliverables_*.py
          -q -p no:cacheprovider
      # Regression: existing export / PDF / scan-metadata suites must stay green.
      - name: Regression suites (PDF export + scan-metadata contract)
        run: >-
          uv run --with pytest python -m pytest
          tests/test_bom_export.py
          tests/test_pdf_export_route.py
          tests/test_pdf_export_smoke.py
          tests/test_pdf_branding.py
          tests/test_cbom_scan_metadata_contract.py
          -q -p no:cacheprovider
  cbom-deliverables-frontend:
    name: CBOM deliverables (frontend type contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci --ignore-scripts
      # tsc only. Raw eslint is not a gate: cbom/page.tsx and backend_api.ts carry
      # 21 pre-existing errors at the base commit.
      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit
