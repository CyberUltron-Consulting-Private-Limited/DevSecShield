name: DAST Check
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  dast-check:
    runs-on: ubuntu-latest
    steps:
      - name: Start DAST (fire-and-forget)
        env:
          CICD_API_KEY: ${{ secrets.CICD_API_KEY }}
          DAST_PROFILE_ID: ${{ secrets.DAST_PROFILE_ID }}
          DAST_API_URL: https://devsecshieldapi.zeroshield.ai/cicd/dast/scan
        run: |
          set -uo pipefail
          # --fail-with-body (curl 7.76+): an HTTP error fails the job and still prints the reason.
          # 429 (rate limited): wait Retry-After seconds (30 if absent, 300 at most), up to 5 tries.
          for attempt in 1 2 3 4 5; do
            rc=0
            code=$(curl --fail-with-body -sS --max-time 120 -o response.json -D headers.txt -w '%{http_code}' \
              -H "cicd-api-key: ${CICD_API_KEY}" -H "Content-Type: application/json" \
              -d "{\"profile_id\": ${DAST_PROFILE_ID}}" "${DAST_API_URL}") || rc=$?
            if [ "${code}" = "429" ] && [ "${attempt}" -lt 5 ]; then
              delay=$(awk 'tolower($1) == "retry-after:" {print $2 + 0}' headers.txt | tail -n 1)
              [ -n "${delay}" ] && [ "${delay}" -gt 0 ] || delay=30
              [ "${delay}" -le 300 ] || delay=300
              echo "DevSecShield is rate limiting this key; retrying in ${delay}s (attempt ${attempt} of 5)"
              sleep "${delay}"
              continue
            fi
            break
          done
          RESPONSE=$(cat response.json 2>/dev/null || true)
          echo "$RESPONSE"
          if [ "${rc}" -ne 0 ]; then
            echo "DAST dispatch failed (curl exit ${rc}, HTTP ${code:-none})"
            exit 1
          fi
          SCAN_ID=$(echo "$RESPONSE" | jq -r '.scan_id')
          if [ -z "$SCAN_ID" ] || [ "$SCAN_ID" = "null" ]; then
            echo "DAST dispatch did not return scan_id"
            exit 1
          fi
          echo "scan_id=$SCAN_ID" >> "$GITHUB_OUTPUT"
          echo "Started DAST scan $SCAN_ID (not waiting; enable wait-and-gate in Jenkinsfile.dast if needed)"
