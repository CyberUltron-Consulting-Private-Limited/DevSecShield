name: PDF Export Smoke

# Builds one PDF per scan type (empty / sparse / typical) plus BOM export
# contract tests. Catches ReportLab TableStyle / Paragraph markup / import
# failures before they break authenticated GET .../export.

on:
  pull_request:
    paths:
      - "backend/utilities/pdf/**"
      - "backend/tests/test_pdf*.py"
      - "backend/tests/test_bom_export.py"
      - "backend/tests/fixtures/*export*"
      - ".github/workflows/pdf-smoke.yml"
  push:
    paths:
      - "backend/utilities/pdf/**"
      - "backend/tests/test_pdf*.py"
      - "backend/tests/test_bom_export.py"
      - "backend/tests/fixtures/*export*"
      - ".github/workflows/pdf-smoke.yml"

jobs:
  pdf-smoke:
    name: PDF generator smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend (frozen lock)
        run: uv sync --frozen

      - name: Build PDFs for all eight scan types
        run: >
          uv run --with pytest python -m pytest
          tests/test_pdf_branding.py
          tests/test_pdf_export_smoke.py
          tests/test_pdf_export_route.py
          tests/test_bom_export.py
          -v --tb=short
