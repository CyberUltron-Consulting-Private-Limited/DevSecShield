services:

  worker:
    container_name: devsecshield-scan-worker
    image: ghcr.io/cyberultron-nikhil/scan-worker:v0
    environment:
      IS_DOCKER_CONTAINER: "True"
    command: uv run celery -A scan_worker worker -P threads --loglevel=info -Q scan_worker_queue
  
  cicd_worker:
    container_name: devsecshield-cicd-worker
    image: ghcr.io/cyberultron-nikhil/cicd-worker:v0
    environment:
      IS_DOCKER_CONTAINER: "True"
    command: uv run celery -A cicd_worker worker -P threads --loglevel=info -Q cicd_worker_queue
  
  guardrail_worker:
    container_name: devsecshield-guardrail-worker
    image: ghcr.io/cyberultron-nikhil/guardrail-worker:v0
    environment:
      IS_DOCKER_CONTAINER: "True"
    command: uv run celery -A guardrail_worker worker -P prefork --concurrency=2 --loglevel=info -Q guardrail_worker_queue
  
  dast_worker:
    container_name: devsecshield-dast-worker
    image: ghcr.io/cyberultron-nikhil/dast-worker:v0
    environment:
      IS_DOCKER_CONTAINER: "True"
    command: uv run celery -A dast_worker worker -P threads --loglevel=info -Q dast_worker_queue


  