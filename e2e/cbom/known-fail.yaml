# Strict known-fail ledger v2 of the CBOM Tier-L gate (DEVILS-ADVOCATE.md §4.1/§4.4; INTERFACES.md §9 and v7 §B).
# Counts are pinned to the gate run on dev named in the PR that last edited this file (bundle sha256 on that PR;
# #75: run L-b5e600471d1a-20261112T141626Z re-judged, then the confirming run posted there; #102 (CB-05, with run 2 and
# the Servers/IDN/Database sources): run L-b5e600471d1a-20261112T155342Z re-judged, confirmed by the next run on #102):
#   * a failing or skipped check no row covers fails the gate;
#   * expect_failing = FAIL + NOT-JUDGED checks the row matches, expect_not_run = its NOT-RUN checks (with not_run_ok);
#     a different count in either direction fails the gate (status "moved"; "stale" when every pinned failure passes):
#     the PR that changes the product edits the row, and proves it with a live run (CI cannot see a run);
#   * match keys are an allowlist (harness/ledger.py MATCH_KEYS): never verdict, id or *_prefix; each row names a
#     check, oracle_id, field, part, step or probe. A list means "any of" (exact strings). The first matching row wins.
# Run `cd e2e/cbom && python3 -m harness.gate judge <run>`: report.md lists each row's status and counts.

# ---------------------------------------------------------------------------- build identity (CB-03, PR #72)
- row: PRE-build-identity
  gate: [G0, G12]
  match: {check: [build_health, build_header, build_frontend_meta, build_node_label, engine_version_eq_build]}
  expect_failing: 5
  issue: "#73"
  owner: CB-03
  why: "dev has no /health build field, X-ZS-Build header, zs-build meta or node build label, and the export's
    zs:engine_version is a constant (main.py:148, common.py:46)"

# ---------------------------------------------------------------------------- product rows (DA §4.4 + gate runs)
- row: KF-4
  gate: [G11]
  match: {kind: oracle, target_id: z09, field: [present, protocol_versions, cipher_suites, cipher_suites/complete,
          groups, groups/complete, algorithm, quantum_vulnerable]}
  expect_failing: 18
  issue: "#73"
  owner: CB-12
  why: "SNI-only server z09 (ssl_reject_handshake on): 'ok' with no versions, suites, groups or certificates read"
- row: KF-5
  gate: [G11]
  match: {kind: oracle, target_id: control, field: extra, reason: extra}
  expect_failing: 1
  issue: "#73"
  owner: CB-12
  why: "the non-TLS control listener (.34) is stored as a tls_endpoint asset (DA-P2, R2 L1)"
- row: KF-6
  gate: [G11]
  match: {kind: oracle, target_id: sshd-pq, field: [host_keys, algorithm], reason: wrong-value}
  expect_failing: 4
  issue: "#73"
  owner: CB-13
  why: "PQ-only OpenSSH (mlkem768x25519-sha256 only): the host key is not read (IncompatiblePeer)"
- row: KF-17
  gate: [G11]
  match: {kind: oracle, target_id: sshd-legacy, field: host_keys, reason: wrong-value}
  expect_failing: 2
  issue: "#73"
  owner: CB-13
  why: "SSH server with RSA-1024 and Ed25519 host keys: only the negotiated Ed25519 key is read, the weak RSA-1024
    key is invisible (one exchange per host-key family)"
- row: KF-18
  gate: [G11]
  match: {kind: oracle, field: [cipher_suites/complete, groups/complete], reason: sample-not-enumeration}
  expect_failing: 11
  issue: "#100"
  owner: CB-12
  why: "TLS endpoints report the negotiated suite/group plus the weak-suite probes, not the accepted set (z01 suites
    and groups, z02 suites, z04 suites and groups)"
- row: KF-18-must-report
  gate: [G11]
  match: {kind: oracle, target_id: z02, field: cipher_suites/must_report, reason: must-report-missing}
  expect_failing: 2
  issue: "#100"
  owner: CB-12
  why: "z02 accepts four weak suites and the lab's must_report lists all four; the product reports one AES-128 suite
    per class (ECDHE-RSA CBC, static RSA CBC) and misses both AES-256 ones: the same sampling gap as #100"
- row: KF-4-5-derived
  gate: [G11]
  match: {kind: derived, field: [closed_world_type, closed_world_quantum]}
  expect_failing: 4
  issue: "#73"
  owner: CB-12
  why: "closed-world counts recomputed from the oracle differ by exactly the KF-4 (z09) and KF-5 (control) assets"
- row: KF-9
  gate: [G11]
  match: {kind: join, view: export, reason: export-missing,
          field: [key_size, curve, signature_algorithm, groups, pqc_class, provenance, job_id]}
  expect_failing: 295
  issue: "#73"
  owner: CB-06
  why: "the run export lacks key size, curve, signature algorithm, groups, pqc_class and provenance (R4 p1)"
- row: KF-15
  gate: [G11]
  match: {kind: join, view: export, field: cipher_suites, reason: export-missing}
  expect_failing: 16
  issue: "#89"
  owner: CB-06
  why: "the run export has no cipher suite: inventory reads facts.ciphers/cipher, the node writes negotiated_cipher
    and weak_ciphers_accepted"
- row: KF-16
  gate: [G11]
  match: {kind: join, view: export, field: protocol_versions, reason: mismatch}
  expect_failing: 11
  issue: "#89"
  owner: CB-06
  why: "the export's protocol version is the negotiated one (TLS) or the word 'ssh': inventory reads facts.protocols,
    the node writes facts.versions"

# ---------------------------------------------------------------------------- lab rows (CB-02, PR #79)
- row: LAB-not-independent-z05b
  gate: [G11]
  match: {kind: oracle, oracle_id: [z05b/tls, "z05b/cert[0]"], reason: lab-not-independent}
  expect_failing: 30
  issue: "#93"
  owner: CB-02
  why: "every z05b key is in the self-check's unverified_keys (CB-02 v7.1 #5: OpenSSL s_client fallback, which the
    prober wraps, O-3): versions, groups, suites, verdicts and all certificate fields, plus the suite derived from
    them. KF-3 (CB-04: ML-DSA-65 certificate read as 'Unknown OID', no verdict) sits inside and returns as its own
    row when the lab verifies z05b independently"
- row: LAB-not-independent-z05
  gate: [G11]
  match: {kind: oracle, oracle_id: z05/tls, field: [cipher_suites, algorithm], reason: lab-not-independent}
  expect_failing: 4
  issue: "#93"
  owner: CB-02
  why: "z05/tls cipher_suites is unverified (nmap cannot complete an X25519MLKEM768-only TLS 1.3 handshake, CB-02
    v7.1 #5), and the negotiated-suite check derived from it inherits that"
- row: LAB-deferred
  gate: [G4, G7, G13, G15, W-INT, W-HOST]
  match: {check: deferred, part: [idp, receiver, ubuntu-tier2, k8s]}
  expect_failing: 0
  expect_not_run: 6
  not_run_ok: "deferred by the lab with a stated reason (INTERFACES v2.1); the row flips when CB-02 builds the part"
  issue: "#93"
  owner: CB-02
  why: "lab parts the CB-02 build does not provide: IdP .42, webhook receiver .43, Ubuntu .40 with Tier-2 sudo, kind"

