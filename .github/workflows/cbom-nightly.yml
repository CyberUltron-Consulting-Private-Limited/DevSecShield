name: CBOM Weekly Benchmark (full repos, live)

# The FULL live CBOM benchmark: LIVE-runs the IBM cbomkit-theia oracle (docker)
# and ours on every repo in bench/cbom/repos.tsv + the synthetic fixture, then
# diffs (true-miss == 0, our-unique > 0). No AWS/Bedrock — CBOM detection is
# offline/deterministic; the oracle is a public container image. The per-PR
# cbom-gates.yml covers synthetic + 2 representative repos hermetically against
# the FROZEN cbomkit-theia snapshots, so this nightly is the only place the live
# oracle is re-run (and where the frozen snapshots are validated for drift).

# Weekly, not nightly (PR #16, architecture review): from 1-10 Nov the AI-BOM run averaged 86 minutes a night
# (8 of 10 cancelled at the 90-minute timeout) on July code, because schedules run from the default branch.
# Make `dev` the default branch so the schedule runs current code; run by hand via workflow_dispatch.
on:
  schedule:
    - cron: "30 7 * * 1"   # Mondays 07:30 UTC, after the AI-BOM run (was nightly)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  nightly-cbom-benchmark:
    name: Full live CBOM benchmark vs IBM cbomkit-theia
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: aibom
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install aibom
        run: uv sync --all-extras --dev || uv sync

      - name: Pull IBM cbomkit-theia oracle image
        run: docker pull ghcr.io/cbomkit/cbomkit-theia:latest

      - name: Run full live CBOM benchmark (cbomkit-theia + ours on all repos)
        run: MAXJ=2 bash ../bench/cbom/run_all.sh

      - name: Diff matrix + gate (true-misses == 0, our-unique > 0)
        run: cd ../bench/cbom && uv run python diff.py

      - name: Upload CBOM benchmark report + outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cbom-nightly-benchmark
          path: |
            bench/cbom/report.md
            bench/cbom/out/*.json
            bench/cbom/state/benchmark.json
          retention-days: 14
