# DevSecShield CBOM team-deliverables E2E proof stack  (compose project: dss-e2e)
#
# Stack     postgres + mongo + backend + frontend, plus two one-shot containers (profile "seed"):
#           aibom-scan (the real CBOM scanner) and seed (writes the team data through the real
#           backend models). No RabbitMQ and no worker: seeded scans carry task_id=None, so the
#           backend never talks to Celery.
# Exposure  ONLY two host ports, both bound to loopback:
#             127.0.0.1:43000 -> frontend      127.0.0.1:43080 -> backend
#           postgres and mongo are NOT published (they live on the project network only).
#           Security note: mongo runs WITHOUT authentication (no MONGO_INITDB_* is ever set, which
#           is also what makes the backend use the no-auth URL), and the backend serves its OpenAPI
#           docs unauthenticated. That is acceptable only because nothing but loopback can reach
#           them and every secret in .env.e2e is a throw-away value.
# Isolation every object carries the label com.dss-e2e=1 (containers, volumes, the network, and
#           the images built by scripts/build.sh). scripts/teardown.sh keys its guard on it.
# No LLM    no service has AWS/Bedrock access: the AWS_* values in .env.e2e are format-only dummies
#           (backend/utilities/ai/chatbot.py raises at import when they are unset), and aibom-scan
#           runs with network_mode: none.
#
# Usage     do not run compose by hand; use e2e/scripts/{preflight,build,up,seed,...}.sh. They pass
#           `-p dss-e2e -f this-file` and export E2E_UID/E2E_GID. `docker compose -p dss-e2e -f
#           <this file> config -q` validates the file without needing .env.e2e (never print the
#           resolved config: with .env.e2e present it would contain the generated secrets).

name: dss-e2e

x-e2e-labels: &e2e-labels
  com.dss-e2e: "1"

# Generated by scripts/build.sh (scripts/lib.sh ensure_env_file). required:false keeps
# `docker compose config` valid before the first build; the scripts refuse to start without it.
x-e2e-env-file: &e2e-env-file
  - path: .env.e2e
    required: false

x-e2e-logging: &e2e-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

# One-shot containers write into the bind-mounted e2e/.work as the invoking host user, so the files
# stay deletable by scripts/teardown.sh. The scripts export the real ids; 1000 only keeps
# `compose config` valid when they are unset.
x-e2e-host-user: &e2e-host-user "${E2E_UID:-1000}:${E2E_GID:-1000}"

services:
  postgres:
    image: postgres:15-alpine
    container_name: dss-e2e-postgres
    labels: *e2e-labels
    env_file: *e2e-env-file
    restart: "no"
    logging: *e2e-logging
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 makes pg_isready use TCP, so it only succeeds once the real server (not the
      # unix-socket-only init server of the entrypoint) is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  mongo:
    image: mongo:8.0.6
    container_name: dss-e2e-mongo
    labels: *e2e-labels
    restart: "no"
    logging: *e2e-logging
    # Deliberately no env_file / environment: MONGO_INITDB_ROOT_* must stay unset (no-auth).
    volumes:
      - mongodata:/data/db
      - mongoconfig:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--norc", "--eval", "quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  backend:
    image: dss-e2e/backend:local
    pull_policy: never
    container_name: dss-e2e-backend
    labels: *e2e-labels
    env_file: *e2e-env-file
    restart: "no"
    logging: *e2e-logging
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:43080:8080"
    volumes:
      # get_scan_metadata's cbom branch reads the rbi/cert-in rollup YAMLs from /aibom/config; the
      # backend image does not contain them (same overlay as compose/main/docker-compose.override.yml).
      - type: bind
        source: ../../compose/aibom-config-overlay
        target: /aibom/config
        read_only: true
        bind:
          create_host_path: false
    # The image ENTRYPOINT (docker-entrypoint.sh) runs `alembic upgrade head` first, which creates the
    # schema in the empty database, then execs this command.
    command:
      - uv
      - run
      - gunicorn
      - main:app
      - -k
      - uvicorn.workers.UvicornWorker
      - --workers
      - "2"
      - --bind
      - 0.0.0.0:8080
      - --timeout
      - "120"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/docs', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 36
      start_period: 90s

  frontend:
    # NEXT_PUBLIC_BACKEND_URL=http://127.0.0.1:43080 is baked in at build time (scripts/build.sh).
    image: dss-e2e/frontend:local
    pull_policy: never
    container_name: dss-e2e-frontend
    labels: *e2e-labels
    restart: "no"
    logging: *e2e-logging
    ports:
      - "127.0.0.1:43000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/login', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 6s
      retries: 24
      start_period: 15s

  # --- one-shot containers (profile "seed"): scripts/seed.sh runs them with `compose run --rm` ---

  # Runs the real CBOM scanner over the ephemeral trees. Contract for e2e/seed/scan_trees.py:
  #   reads  $E2E_TREES_DIR (/work/trees, read-only)   writes $E2E_OUT_DIR (/work/out)
  aibom-scan:
    image: dss-e2e/aibom-scan:local
    pull_policy: never
    profiles: ["seed"]
    labels: *e2e-labels
    restart: "no"
    network_mode: none
    user: *e2e-host-user
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    environment:
      HOME: /tmp
      E2E_TREES_DIR: /work/trees
      E2E_OUT_DIR: /work/out
    volumes:
      - type: bind
        source: ../.work/trees
        target: /work/trees
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../.work/out
        target: /work/out
        bind:
          create_host_path: false
      - type: bind
        source: ../seed
        target: /e2e/seed
        read_only: true
        bind:
          create_host_path: false
    command: ["python", "/e2e/seed/scan_trees.py"]

  # Creates users / teams / scans through the real backend models and the real
  # create_findings_in_mongo_db. Contract for e2e/seed/seed_team.py:
  #   reads  $E2E_WORK_DIR/out/*.scan_data.json (/work/out), $E2E_WORK_DIR/trees (certificate files, for the
  #          independent oracle), $E2E_LEGACY_SCAN_DATA and /e2e/fixtures/expected.json
  #   writes $E2E_WORK_DIR/seed.json (/work/seed.json) for the Playwright specs
  #   $E2E_SEED_PERF=1 is set by `seed.sh --perf`
  # The image ENTRYPOINT (alembic + gunicorn) is bypassed: the backend service already migrated.
  seed:
    image: dss-e2e/backend:local
    pull_policy: never
    profiles: ["seed"]
    labels: *e2e-labels
    env_file: *e2e-env-file
    restart: "no"
    user: *e2e-host-user
    working_dir: /backend
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      backend:
        condition: service_healthy
    entrypoint: ["/backend/.venv/bin/python"]
    command: ["/e2e/seed/seed_team.py"]
    environment:
      HOME: /tmp
      E2E_WORK_DIR: /work
      E2E_LEGACY_SCAN_DATA: /e2e/backend-fixtures/cbom_export_scandata.json
    volumes:
      - type: bind
        source: ../.work
        target: /work
        bind:
          create_host_path: false
      - type: bind
        source: ../seed
        target: /e2e/seed
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../backend/tests/fixtures
        target: /e2e/backend-fixtures
        read_only: true
        bind:
          create_host_path: false
      # fixtures/expected.json: seed_team.py verifies Appendix B against it before storing anything.
      - type: bind
        source: ../fixtures
        target: /e2e/fixtures
        read_only: true
        bind:
          create_host_path: false

volumes:
  pgdata:
    labels: *e2e-labels
  mongodata:
    labels: *e2e-labels
  mongoconfig:
    labels: *e2e-labels

networks:
  default:
    labels: *e2e-labels
